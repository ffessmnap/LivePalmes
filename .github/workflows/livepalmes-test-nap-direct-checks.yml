name: Verifier les lectures NAP directes sur TEST
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      confirmation:
        description: Saisir livepalmes-test-nap-direct-readonly
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-test
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verifier la cible
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$CONFIRMATION" = livepalmes-test-nap-direct-readonly
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - run: node tools/inspect-nap-direct-queries.js
      - uses: actions/upload-artifact@v4
        with:
          name: nap-direct-query-plans
          path: outputs/nap-direct-query-plans.json
          if-no-files-found: error
          retention-days: 14
