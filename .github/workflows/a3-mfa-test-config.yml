name: Preparer uniquement TOTP sur TEST sans toucher aux comptes
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Main exact controle CI
        type: string
        required: true
      operation:
        description: Observer avant toute activation TOTP TEST
        type: choice
        default: inspect
        options:
          - inspect
          - enable-totp
      expected_mfa_sha256:
        description: Empreinte MFA du recu inspect authentifie ; vide pour inspect
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: a3-mfa-test-config
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.expected_commit == github.sha
    environment: firebase-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_MFA_SHA256: ${{ inputs.expected_mfa_sha256 }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Authentifier la CI exacte avant credential
        id: ci
        run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/a3-mfa-ci"
      - name: Verifier contexte et operation avant credential
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: node -e "require('./tools/a3-mfa-test-config').context(process.env, process.env.OPERATION)"
      - name: Installer seulement les dependances verrouillees
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Utiliser le compte TEST existant
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST }}
          project_id: livepalmes-test
      - name: Observer ou activer seulement le fournisseur TOTP TEST
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: node tools/a3-mfa-test-config.js "$OPERATION" "$RUNNER_TEMP/a3-mfa-test-config"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: a3-mfa-test-config-proof
          path: ${{ runner.temp }}/a3-mfa-test-config/*.json
          if-no-files-found: warn
          retention-days: 14
