name: Preparer les deux index PROD de historique des comptes
'on':
  workflow_dispatch:
    inputs:
      a6_notifications:
        description: Index unique de la file NAP du candidat A6 vérifié
        type: boolean
        default: false
      mode:
        type: choice
        options: [inspect, apply]
        default: inspect
        required: true
      approved_plan:
        type: string
        default: ''
      confirmation:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
jobs:
  indexes:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      APPROVED_PLAN: ${{ inputs.approved_plan }}
      INDEX_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python tests/production-account-history-indexes-tests.py
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
          project_id: livepalmes
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - if: ${{ !inputs.a6_notifications }}
        run: python tools/production-account-history-indexes.py "$MODE" "$RUNNER_TEMP/account-indexes" "$APPROVED_PLAN"
      - if: inputs.a6_notifications
        run: python tools/a6-production-index.py "$MODE" "$RUNNER_TEMP/account-indexes" "$APPROVED_PLAN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.a6_notifications && 'a6-production-index' || 'production-account-history-indexes' }}
          path: ${{ runner.temp }}/account-indexes/*.json
          if-no-files-found: error
          retention-days: 14
