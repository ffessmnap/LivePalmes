name: Publier la version commune sur TEST
run-name: ${{ inputs.verification_only && 'Verification TEST sans deploiement' || 'Publier TEST commun' }}
'on':
  workflow_dispatch:
    inputs:
      production_commit:
        description: SHA applicatif actuellement en PROD pour detecter les changements backend
        required: true
        type: string
      approved_top_files:
        description: Inclure les deux fichiers TOP 200BI M-S exacts autorises par Antoine le 5 octobre sur TEST uniquement
        required: true
        type: boolean
        default: false
      approved_records_cleanup:
        description: Retrait TEST de la seule copie RF/MPF historique et de son en-tete cache, autorise le 12 octobre
        required: true
        type: boolean
        default: false
      approved_public_export_cleanup:
        description: Retrait TEST des seuls exports TOP/nageurs historiques inventoriés le 12 octobre
        required: true
        type: boolean
        default: false
      dtn_extension:
        description: Valider hors ligne les deux dependances DTN autorisees (sans automatisme TEST)
        required: true
        type: boolean
        default: false
      approved_home_routing:
        description: Autoriser sur TEST seulement les routes / et /index.html vers l'accueil serveur approuve le 15 octobre
        required: false
        type: boolean
        default: false
      verification_only:
        description: Verifier la reutilisation du backend sans aucun deploiement
        required: true
        type: boolean
        default: false
      hosting_only:
        description: Publier seulement Hosting ; refuser toute selection backend non vide
        required: true
        type: boolean
        default: false
      followup_depth:
        description: Compteur technique de suivi main (laisser 0 au lancement manuel)
        required: false
        type: number
        default: 0
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
jobs:
  coordinate:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - id: decision
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TEST_INPUTS: ${{ toJSON(inputs) }}
      run: python tools/coordinate-test-publication.py prepare
  test:
    needs: coordinate
    if: needs.coordinate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: firebase-test
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      TARGET_FIREBASE_PROJECT: livepalmes-test
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
        path: candidate
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |
          candidate/functions/package-lock.json
          candidate/tests/firestore-rules/package-lock.json
    - name: Verifier le commit main et classer les changements
      id: scope
      env:
        BASE_SHA: ${{ inputs.production_commit }}
        APPROVED_TOP_FILES: ${{ inputs.approved_top_files }}
        APPROVED_RECORDS_CLEANUP: ${{ inputs.approved_records_cleanup }}
        APPROVED_PUBLIC_EXPORT_CLEANUP: ${{ inputs.approved_public_export_cleanup }}
        APPROVED_HOME_ROUTING: ${{ inputs.approved_home_routing }}
      run: '[[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        git merge-base --is-ancestor "$GITHUB_SHA" origin/main

        python - <<''PYCODE''

        import importlib.util, os, json, subprocess

        from pathlib import Path

        spec=importlib.util.spec_from_file_location(''cycle'',''tools/release-cycle.py''); m=importlib.util.module_from_spec(spec);
        spec.loader.exec_module(m)

        subprocess.run([''git'',''merge-base'',''--is-ancestor'',os.environ[''BASE_SHA''],''HEAD''],check=True)

        paths=subprocess.check_output([''git'',''diff'',''--name-only'',''--no-renames'',os.environ[''BASE_SHA''],''HEAD''],text=True).splitlines()

        m.classify_test(paths, os.environ[''APPROVED_TOP_FILES''] == ''true'', os.environ[''APPROVED_RECORDS_CLEANUP''] == ''true'', os.environ[''APPROVED_PUBLIC_EXPORT_CLEANUP''] == ''true'', os.environ[''APPROVED_HOME_ROUTING''] == ''true'')

        PYCODE'
    - name: Rechercher la verification du commit main exact
      id: verified-main
      run: python tools/test-verification-evidence.py reuse "$RUNNER_TEMP/application-verification"
    - name: Installer les dependances verrouillees en parallele
      run: |
        npm ci --prefix functions --prefer-offline --no-audit --no-fund &
        functions_pid=$!
        npm ci --prefix tests/firestore-rules --prefer-offline --no-audit --no-fund &
        rules_pid=$!
        result=0
        wait "$functions_pid" || result=1
        wait "$rules_pid" || result=1
        exit "$result"
    - name: Verifier la version ou reutiliser la preuve exacte
      id: application-checks
      env:
        MAIN_VERIFIED: ${{ steps.verified-main.outputs.verified }}
      run: |
        if [ "$MAIN_VERIFIED" = true ]; then
          echo "Verification applicative du commit exact reutilisee depuis la preuve CI main."
        else
          node tools/verify-livepalmes.js
        fi

        python tests/production-pdf-functions-tests.py

        python tests/production-release-state-tests.py

        python tests/release-cycle-tests.py

        python tests/release-composed-evidence-tests.py

        node tests/release-function-fingerprints-tests.js

        python tests/test-publication-coordination-tests.py

        node tests/nap-source-diagnostic-tests.js

        python tests/test-verification-evidence-tests.py
    - uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
        project_id: livepalmes-test
    - uses: google-github-actions/setup-gcloud@v3
    - name: Selectionner les Functions TEST reellement differentes
      id: selection
      env:
        HOSTING_ONLY: ${{ inputs.hosting_only }}
      run: python tools/release-cycle.py test-selection "$RUNNER_TEMP" .
    - name: Preparer le backend TEST
      if: steps.selection.outputs.backend == 'true' && !inputs.verification_only && !inputs.hosting_only
      run: 'python tools/release-cycle.py stage . livepalmes-test "$RUNNER_TEMP/.firebase-test-functions" "$CANDIDATE_SHA"

        npm ci --prefix "$RUNNER_TEMP/.firebase-test-functions/functions"'
    - name: Simuler les Functions TEST
      if: steps.selection.outputs.backend == 'true' && !inputs.verification_only && !inputs.hosting_only
      run: python tools/release-cycle.py batches livepalmes-test . "$RUNNER_TEMP/.firebase-test-functions" "$RUNNER_TEMP/test-selection.json"
        dry-run
    - name: Publier et controler les Functions TEST
      if: steps.selection.outputs.backend == 'true' && !inputs.verification_only && !inputs.hosting_only
      run: python tools/release-cycle.py batches livepalmes-test . "$RUNNER_TEMP/.firebase-test-functions" "$RUNNER_TEMP/test-selection.json"
        deploy
    - name: Controler le backend TEST et les Functions conservees
      run: python tools/release-cycle.py check-test "$RUNNER_TEMP" .
    - name: Verifier les dependances DTN sans invocation ni deploiement
      if: inputs.dtn_extension && !inputs.verification_only
      id: dtn-checks
      run: node tests/dtn-shared-invalidation-tests.js
    - uses: google-github-actions/auth@v3
      if: '!inputs.verification_only'
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST }}
        project_id: livepalmes-test
    - name: Publier TEST commun pour le commit exact verifie
      if: '!inputs.verification_only'
      run: 'node tools/check-hosting-payload.js .

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        tests/firestore-rules/node_modules/.bin/firebase deploy --project livepalmes-test --only hosting --non-interactive
        --message "LivePalmes $CANDIDATE_SHA run $GITHUB_RUN_ID"'
    - uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
        project_id: livepalmes-test
    - name: Conserver la preuve de la version TEST
      if: '!inputs.verification_only'
      env:
        APPLICATION_CHECKS: ${{ steps.application-checks.outcome }}
        DTN_EXTENSION_CHECKS: ${{ steps.dtn-checks.outcome }}
      run: python tools/release-cycle.py proof "$RUNNER_TEMP/test-proof"
    - uses: actions/upload-artifact@v4
      if: '!inputs.verification_only'
      with:
        name: test-proof
        path: ${{ runner.temp }}/test-proof/test-proof.json
        if-no-files-found: error
        retention-days: 14
    defaults:
      run:
        working-directory: candidate
  followup:
    needs: [coordinate, test]
    if: >-
      always() && !cancelled() && needs.coordinate.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !inputs.verification_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TEST_INPUTS: ${{ toJSON(inputs) }}
      run: python tools/coordinate-test-publication.py followup
