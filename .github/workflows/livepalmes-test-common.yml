name: Publier la version commune sur TEST
run-name: ${{ inputs.verification_only && 'Verification TEST sans deploiement' || 'Publier TEST commun' }}
'on':
  workflow_dispatch:
    inputs:
      automatic_candidate:
        description: SHA exact de la CI automatique (laisser vide au lancement manuel)
        required: false
        type: string
        default: ''
      production_commit:
        description: SHA applicatif actuellement en PROD pour detecter les changements backend
        required: true
        type: string
      approved_top_files:
        description: Inclure les deux fichiers TOP 200BI M-S exacts autorises par Antoine le 5 octobre sur TEST uniquement
        required: true
        type: boolean
        default: false
      approved_records_cleanup:
        description: Retrait TEST de la seule copie RF/MPF historique et de son en-tete cache, autorise le 12 octobre
        required: true
        type: boolean
        default: false
      approved_public_export_cleanup:
        description: Retrait TEST des seuls exports TOP/nageurs historiques inventoriés le 12 octobre
        required: true
        type: boolean
        default: false
      approved_club_reference_cleanup:
        description: Retrait TEST exact des deux referentiels clubs statiques autorise le 10 novembre ; empreintes et absence controlees
        required: false
        type: boolean
        default: false
      approved_a1_public_privacy:
        description: Contrat TEST A1 exact, source publique deja verifiee et retrait du seul referentiel approuve
        required: false
        type: boolean
        default: false
      dtn_extension:
        description: Valider hors ligne les deux dependances DTN autorisees (sans automatisme TEST)
        required: true
        type: boolean
        default: false
      approved_home_routing:
        description: Autoriser sur TEST seulement les routes / et /index.html vers l'accueil serveur approuve le 15 octobre
        required: false
        type: boolean
        default: false
      verification_only:
        description: Verifier la reutilisation du backend sans aucun deploiement
        required: true
        type: boolean
        default: false
      hosting_only:
        description: Publier seulement Hosting ; refuser toute selection backend non vide
        required: true
        type: boolean
        default: false
      approved_portal_session_rules:
        description: Restriction exacte de l'annuaire TEST pour la session portail 24h approuvee le 2 novembre ; aucun index ni PROD
        required: false
        type: boolean
        default: false
      approved_admin_mfa_rules:
        description: Obligation TOTP admin.full TEST exacte apres sources MFA attestees, aucun index ni PROD
        required: false
        type: boolean
        default: false
      approved_a34_session_rules:
        description: Fermeture exacte de l'annuaire TEST A3.4a apres sources verifiees, aucun index ni PROD
        required: false
        type: boolean
        default: false
      approved_direct_realtime_rules:
        description: Signal prive Direct TEST exact approuve le 13 novembre ; sources deja publiees, regles seules puis Hosting
        required: false
        type: boolean
        default: false
      approved_static_asset_cache:
        description: Huit changements de cache exacts approuves le 9 novembre, Hosting TEST manuel seulement
        required: false
        type: boolean
        default: false
      approved_a3_http_headers:
        description: Dix couples exacts A3.6a sur cinq routes ; Hosting TEST manuel seulement
        required: false
        type: boolean
        default: false
      approved_direct_csp:
        description: Cinq CSP accueil et Direct exactes A3, Hosting TEST manuel seulement, aucun autre accord sensible
        required: false
        type: boolean
        default: false
      approved_app_check_csp:
        description: Trois ajouts de chemins CSP Google sur portail TEST, client App Check en observation, aucun enforcement ni PROD
        required: false
        type: boolean
        default: false
      a6_index_run:
        description: Reçu officiel du seul index A6 déjà prêt sur le commit TEST exact
        type: string
        required: false
        default: ''
      approved_a5_retirement:
        description: Retrait ferme des seules pages, cinq sources et deux dossiers historiques Direct A5
        required: false
        type: boolean
        default: false
      followup_depth:
        description: Compteur technique de suivi main (laisser 0 au lancement manuel)
        required: false
        type: number
        default: 0
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
env:
  npm_config_fetch_retries: '2'
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retry_mintimeout: '1000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  coordinate:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - id: decision
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TEST_INPUTS: ${{ toJSON(inputs) }}
      run: python tools/coordinate-test-publication.py prepare
  test:
    needs: coordinate
    if: needs.coordinate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: firebase-test
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      TARGET_FIREBASE_PROJECT: livepalmes-test
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
        path: candidate
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      timeout-minutes: 3
      with:
        node-version: '22.23.5'
        check-latest: false
        cache: npm
        cache-dependency-path: |
          candidate/functions/package-lock.json
          candidate/tests/firestore-rules/package-lock.json
    - name: Rechercher la verification du commit main exact
      id: verified-main
      run: python tools/test-verification-evidence.py reuse "$RUNNER_TEMP/application-verification"
    - name: Rechercher la verification du circuit exact
      id: verified-publication
      run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/publication-verification"
    - name: Installer les dependances verrouillees en parallele
      env:
        TEST_VERIFICATION_ONLY: ${{ inputs.verification_only }}
        MAIN_VERIFIED: ${{ steps.verified-main.outputs.verified }}
        PUBLICATION_VERIFIED: ${{ steps.verified-publication.outputs.verified }}
      run: |
        functions_pid=""
        if [ "$TEST_VERIFICATION_ONLY" = true ] && [ "$MAIN_VERIFIED" = true ] && [ "$PUBLICATION_VERIFIED" = true ]; then
          test ! -e functions/node_modules
          echo "Verification seule : installation Functions evitee avec les deux preuves CI main exactes."
        else
          npm ci --prefix functions --prefer-offline --no-audit --no-fund &
          functions_pid=$!
        fi
        npm ci --prefix tests/firestore-rules --prefer-offline --no-audit --no-fund &
        rules_pid=$!
        result=0
        if [ -n "$functions_pid" ]; then wait "$functions_pid" || result=1; fi
        wait "$rules_pid" || result=1
        if [ -z "$functions_pid" ]; then
          test ! -e functions/node_modules || result=1
          if [ "$result" = 0 ]; then echo "Verification seule : functions/node_modules absent apres installation."; fi
        fi
        exit "$result"
    - name: Preparer le parseur verrouille si une origine Git historique manque
      run: python tools/prepare-history-parser.py
    - name: Verifier le commit main et classer les changements
      id: scope
      env:
        BASE_SHA: ${{ inputs.production_commit }}
        A6_HOSTING_MODE: ${{ inputs.hosting_only }}
        A6_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        A6_INDEX_RUN: ${{ inputs.a6_index_run }}
        APPROVED_TOP_FILES: ${{ inputs.approved_top_files }}
        APPROVED_RECORDS_CLEANUP: ${{ inputs.approved_records_cleanup }}
        APPROVED_PUBLIC_EXPORT_CLEANUP: ${{ inputs.approved_public_export_cleanup }}
        APPROVED_CLUB_REFERENCE_CLEANUP: ${{ inputs.approved_club_reference_cleanup }}
        APPROVED_A1_PUBLIC_PRIVACY: ${{ inputs.approved_a1_public_privacy }}
        A1_PRIVACY_HOSTING_MODE: ${{ inputs.hosting_only }}
        A1_PRIVACY_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        APPROVED_HOME_ROUTING: ${{ inputs.approved_home_routing }}
        APPROVED_PORTAL_SESSION_RULES: ${{ inputs.approved_portal_session_rules }}
        APPROVED_ADMIN_MFA_RULES: ${{ inputs.approved_admin_mfa_rules }}
        ADMIN_MFA_HOSTING_MODE: ${{ inputs.hosting_only }}
        ADMIN_MFA_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        APPROVED_A34_SESSION_RULES: ${{ inputs.approved_a34_session_rules }}
        A34_HOSTING_MODE: ${{ inputs.hosting_only }}
        A34_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        APPROVED_DIRECT_REALTIME_RULES: ${{ inputs.approved_direct_realtime_rules }}
        DIRECT_REALTIME_RULES_REUSE: 'true'
        APPROVED_STATIC_ASSET_CACHE: ${{ inputs.approved_static_asset_cache }}
        STATIC_CACHE_HOSTING_MODE: ${{ inputs.hosting_only }}
        STATIC_CACHE_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        APPROVED_A3_HTTP_HEADERS: ${{ inputs.approved_a3_http_headers }}
        A3_HTTP_HOSTING_MODE: ${{ inputs.hosting_only }}
        A3_HTTP_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        APPROVED_DIRECT_CSP: ${{ inputs.approved_direct_csp }}
        DIRECT_CSP_HOSTING_MODE: ${{ inputs.hosting_only }}
        DIRECT_CSP_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        DIRECT_CSP_VERIFICATION_ONLY: ${{ inputs.verification_only }}
        APPROVED_A5_RETIREMENT: ${{ inputs.approved_a5_retirement }}
        A5_HOSTING_MODE: ${{ inputs.hosting_only }}
        A5_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        APPROVED_APP_CHECK_CSP: ${{ inputs.approved_app_check_csp }}
        APP_CHECK_CSP_HOSTING_MODE: ${{ inputs.hosting_only }}
        APP_CHECK_CSP_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        PORTAL_SESSION_RULES_REUSE: 'true'
      run: '[[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        git merge-base --is-ancestor "$GITHUB_SHA" origin/main

        python - <<''PYCODE''

        import importlib.util, os, json

        from pathlib import Path

        spec=importlib.util.spec_from_file_location(''cycle'',''tools/release-cycle.py''); m=importlib.util.module_from_spec(spec);
        spec.loader.exec_module(m)

        m.git(''merge-base'',''--is-ancestor'',os.environ[''BASE_SHA''],''HEAD'')

        paths=m.git(''diff'',''--name-only'',''--no-renames'',os.environ[''BASE_SHA''],''HEAD'').splitlines()

        m.classify_test(paths, os.environ[''APPROVED_TOP_FILES''] == ''true'', os.environ[''APPROVED_RECORDS_CLEANUP''] == ''true'', os.environ[''APPROVED_PUBLIC_EXPORT_CLEANUP''] == ''true'', os.environ[''APPROVED_HOME_ROUTING''] == ''true'', os.environ[''APPROVED_PORTAL_SESSION_RULES''] == ''true'', os.environ[''APPROVED_STATIC_ASSET_CACHE''] == ''true'', approved_club_reference_cleanup=os.environ[''APPROVED_CLUB_REFERENCE_CLEANUP''] == ''true'', approved_direct_realtime_rules=os.environ[''APPROVED_DIRECT_REALTIME_RULES''] == ''true'', approved_a1_public_privacy=os.environ[''APPROVED_A1_PUBLIC_PRIVACY''] == ''true'', approved_a3_http_headers=os.environ[''APPROVED_A3_HTTP_HEADERS''] == ''true'', approved_a34_session_rules=os.environ[''APPROVED_A34_SESSION_RULES''] == ''true'', approved_direct_csp=os.environ[''APPROVED_DIRECT_CSP''] == ''true'', approved_admin_mfa_rules=os.environ[''APPROVED_ADMIN_MFA_RULES''] == ''true'', approved_app_check_csp=os.environ[''APPROVED_APP_CHECK_CSP''] == ''true'', approved_a5_retirement=os.environ[''APPROVED_A5_RETIREMENT''] == ''true'', a6_index_run=os.environ.get(''A6_INDEX_RUN''))

        PYCODE'
    - name: Verifier la version ou reutiliser la preuve exacte
      id: application-checks
      env:
        MAIN_VERIFIED: ${{ steps.verified-main.outputs.verified }}
      run: |
        if [ "$MAIN_VERIFIED" = true ]; then
          echo "Verification applicative du commit exact reutilisee depuis la preuve CI main."
        else
          node tools/verify-livepalmes.js
        fi
    - name: Verifier le circuit ou reutiliser la preuve exacte
      if: steps.verified-publication.outputs.verified != 'true'
      run: |
        python tests/a1-public-privacy-test-policy-tests.py

        python tests/production-pdf-functions-tests.py

        python tests/production-release-state-tests.py

        python tests/release-cycle-tests.py

        python tests/release-composed-evidence-tests.py

        node tests/release-function-fingerprints-tests.js

        python tests/test-publication-coordination-tests.py

        python tests/portal-session-rules-tests.py

        python tests/direct-realtime-rules-policy-tests.py

        python tests/test-static-cache-policy-tests.py

        python tests/test-http-headers-policy-tests.py

        python tests/test-portal-session-prepare-sources-tests.py

        python tests/test-a34-session-enforcement-tests.py

        python tests/test-a34-session-rules-tests.py

        python tests/test-direct-csp-policy-tests.py

        node tests/nap-source-diagnostic-tests.js

        python tests/test-verification-evidence-tests.py
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
        project_id: livepalmes-test
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
    - name: Controler les regles de session TEST avant toute publication
      env:
        A5_RULES_WRITE: ${{ inputs.approved_a5_retirement }}
        A5_HOSTING_MODE: ${{ inputs.hosting_only }}
        A5_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        A5_VERIFICATION_ONLY: ${{ inputs.verification_only }}
        ADMIN_MFA_RULES_WRITE: ${{ inputs.approved_admin_mfa_rules }}
        ADMIN_MFA_HOSTING_MODE: ${{ inputs.hosting_only }}
        ADMIN_MFA_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        ADMIN_MFA_VERIFICATION_ONLY: ${{ inputs.verification_only }}
        A34_RULES_WRITE: ${{ inputs.approved_a34_session_rules }}
        A34_HOSTING_MODE: ${{ inputs.hosting_only }}
        A34_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        A34_VERIFICATION_ONLY: ${{ inputs.verification_only }}
        PORTAL_SESSION_RULES_WRITE: ${{ inputs.approved_portal_session_rules }}
        DIRECT_REALTIME_RULES_WRITE: ${{ inputs.approved_direct_realtime_rules }}
        DIRECT_REALTIME_VERIFICATION_ONLY: ${{ inputs.verification_only }}
      run: python tools/check-current-test-rules.py . "$RUNNER_TEMP/test-portal-session-rules-proof.json"
    - name: Selectionner les Functions TEST reellement differentes
      id: selection
      env:
        HOSTING_ONLY: ${{ inputs.hosting_only }}
      run: python tools/release-cycle.py test-selection "$RUNNER_TEMP" .
    - name: Preparer le backend TEST
      if: steps.selection.outputs.backend == 'true' && !inputs.verification_only && !inputs.hosting_only
      run: 'python tools/release-cycle.py stage . livepalmes-test "$RUNNER_TEMP/.firebase-test-functions" "$CANDIDATE_SHA"

        npm ci --prefix "$RUNNER_TEMP/.firebase-test-functions/functions"'
    - name: Simuler les Functions TEST
      if: steps.selection.outputs.backend == 'true' && !inputs.verification_only && !inputs.hosting_only
      run: python tools/release-cycle.py batches livepalmes-test . "$RUNNER_TEMP/.firebase-test-functions" "$RUNNER_TEMP/test-selection.json"
        dry-run
    - name: Publier et controler les Functions TEST
      if: steps.selection.outputs.backend == 'true' && !inputs.verification_only && !inputs.hosting_only
      run: python tools/release-cycle.py batches livepalmes-test . "$RUNNER_TEMP/.firebase-test-functions" "$RUNNER_TEMP/test-selection.json"
        deploy
    - name: Controler le backend TEST et les Functions conservees
      env:
        TEST_VERIFICATION_ONLY: ${{ inputs.verification_only }}
      run: python tools/release-cycle.py check-test "$RUNNER_TEMP" .
    - name: Fermer les seuls dossiers historiques Direct A5 TEST apres les cinq sources
      if: inputs.approved_a5_retirement && !inputs.verification_only && inputs.hosting_only
      env:
        A5_RULES_WRITE: ${{ inputs.approved_a5_retirement }}
        A5_HOSTING_MODE: ${{ inputs.hosting_only }}
        A5_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        A5_VERIFICATION_ONLY: ${{ inputs.verification_only }}
      run: python tools/a5-legacy-direct-test-policy.py deploy . "$RUNNER_TEMP/test-portal-session-rules-proof.json"
    - name: Publier uniquement le signal prive Direct Firestore TEST explicitement approuve
      if: inputs.approved_direct_realtime_rules && !inputs.verification_only && inputs.hosting_only
      env:
        DIRECT_REALTIME_RULES_APPROVAL: '20261113-direct-private-realtime-test'
        DIRECT_REALTIME_VERIFICATION_ONLY: ${{ inputs.verification_only }}
        HOSTING_ONLY: ${{ inputs.hosting_only }}
        AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
      run: python tools/test-direct-realtime-rules.py . "$RUNNER_TEMP/test-direct-realtime-rules-proof.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: inputs.approved_direct_realtime_rules && !inputs.verification_only
      with:
        name: direct-realtime-rules-proof
        path: ${{ runner.temp }}/test-direct-realtime-rules-proof.json
        if-no-files-found: error
        retention-days: 14
    - name: Appliquer uniquement les Rules MFA admin.full TEST apres sources verifiees
      if: inputs.approved_admin_mfa_rules && !inputs.verification_only && inputs.hosting_only
      env:
        ADMIN_MFA_RULES_APPROVAL: '20261118-admin-full-mfa-test'
        ADMIN_MFA_RULES_WRITE: ${{ inputs.approved_admin_mfa_rules }}
        ADMIN_MFA_HOSTING_MODE: ${{ inputs.hosting_only }}
        ADMIN_MFA_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        ADMIN_MFA_VERIFICATION_ONLY: ${{ inputs.verification_only }}
      run: python tools/test-admin-mfa-rules.py deploy . "$RUNNER_TEMP/test-portal-session-rules-proof.json"
    - name: Fermer uniquement l annuaire A3.4a TEST apres sources verifiees
      if: inputs.approved_a34_session_rules && !inputs.verification_only && inputs.hosting_only
      env:
        A34_RULES_APPROVAL: '20261117-a34-portal-session-enforcement-test'
        A34_RULES_WRITE: ${{ inputs.approved_a34_session_rules }}
        A34_HOSTING_MODE: ${{ inputs.hosting_only }}
        A34_AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
        A34_VERIFICATION_ONLY: ${{ inputs.verification_only }}
      run: python tools/test-a34-session-rules.py deploy . "$RUNNER_TEMP/test-portal-session-rules-proof.json"
    - name: Publier uniquement la restriction de session Firestore TEST explicitement approuvee
      if: inputs.approved_portal_session_rules && !inputs.verification_only && !inputs.hosting_only
      env:
        PORTAL_SESSION_RULES_APPROVAL: '20261102-portal-session-24h-test'
        HOSTING_ONLY: ${{ inputs.hosting_only }}
        AUTOMATIC_CANDIDATE: ${{ inputs.automatic_candidate }}
      run: python tools/test-portal-session-rules.py . "$RUNNER_TEMP/test-portal-session-rules-proof.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: '!inputs.verification_only'
      with:
        name: portal-session-rules-proof
        path: ${{ runner.temp }}/test-portal-session-rules-proof.json
        if-no-files-found: error
        retention-days: 14
    - name: Verifier les dependances DTN sans invocation ni deploiement
      if: inputs.dtn_extension && !inputs.verification_only
      id: dtn-checks
      run: node tests/dtn-shared-invalidation-tests.js
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      if: '!inputs.verification_only'
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST }}
        project_id: livepalmes-test
    - name: Publier TEST commun pour le commit exact verifie
      if: '!inputs.verification_only'
      run: 'node tools/check-hosting-payload.js .

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        node tools/prepare-test-hosting-config.js --project livepalmes-test

        tests/firestore-rules/node_modules/.bin/firebase deploy --project livepalmes-test --only hosting --non-interactive
        --config tmp/firebase-test-hosting/firebase.json --message "LivePalmes $CANDIDATE_SHA run $GITHUB_RUN_ID"'
    - name: Verifier les anciennes URL A5 absentes et le nouveau Direct identique
      if: inputs.approved_a5_retirement && !inputs.verification_only
      run: python tools/a5-legacy-direct-hosting-check.py livepalmes-test "$CANDIDATE_SHA" "$RUNNER_TEMP/a5-retirement-http-proof.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: inputs.approved_a5_retirement && !inputs.verification_only
      with:
        name: a5-retirement-http-proof
        path: ${{ runner.temp }}/a5-retirement-http-proof.json
        if-no-files-found: error
        retention-days: 14
    - name: Relever les apercus TEST sans les modifier
      if: '!inputs.verification_only'
      run: tests/firestore-rules/node_modules/.bin/firebase hosting:channel:list --project livepalmes-test --site livepalmes-test
        --config tmp/firebase-test-hosting/firebase.json --json > "$RUNNER_TEMP/test-hosting-channels.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: '!inputs.verification_only'
      with:
        name: test-hosting-channels
        path: ${{ runner.temp }}/test-hosting-channels.json
        if-no-files-found: error
        retention-days: 14
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
        project_id: livepalmes-test
    - name: Conserver la preuve de la version TEST
      if: '!inputs.verification_only'
      env:
        APPLICATION_CHECKS: ${{ steps.application-checks.outcome }}
        DTN_EXTENSION_CHECKS: ${{ steps.dtn-checks.outcome }}
      run: python tools/release-cycle.py proof "$RUNNER_TEMP/test-proof"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: '!inputs.verification_only'
      with:
        name: test-proof
        path: ${{ runner.temp }}/test-proof/test-proof.json
        if-no-files-found: error
        retention-days: 14
    - name: Distinguer installations et tests
      if: always()
      timeout-minutes: 1
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -f "tools/ci-runtime.py" ]; then
          python "tools/ci-runtime.py" timings
        else
          echo "Mesure indisponible pour ce candidat historique ; controles inchanges." >> "$GITHUB_STEP_SUMMARY"
        fi
    defaults:
      run:
        working-directory: candidate
  followup:
    needs: [coordinate, test]
    if: >-
      always() && !cancelled() && needs.coordinate.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !inputs.verification_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TEST_INPUTS: ${{ toJSON(inputs) }}
      run: python tools/coordinate-test-publication.py followup
