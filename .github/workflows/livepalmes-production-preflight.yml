name: Preparer le bilan PROD sans deployer
'on':
  workflow_dispatch:
    inputs:
      optional_access_completion:
        description: Complement ferme du seul run44405688714,110sources deja attestees, Hosting seulement
        required: false
        type: boolean
        default: false
      session_enforcement_completion:
        description: Complement ferme du seul run44099971258, sources deja attestees, aucune nouvelle source
        required: false
        type: boolean
        default: false
      request_file:
        description: Fichier .github/releases/*.json contenant le bilan valide
        required: false
        type: string
      request_json:
        description: Bilan JSON complet, alternative au fichier versionne (64 Kio maximum)
        required: false
        type: string
      source_benchmark_run:
        description: Run TEST comparant 3/6 builds, sinon 0 (trois builds conserves)
        required: false
        type: string
        default: '0'
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
env:
  npm_config_fetch_retries: '2'
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retry_mintimeout: '1000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.session_enforcement_completion && !inputs.optional_access_completion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Initialiser les chemins temporaires
      run: |
        echo "PLAN=$RUNNER_TEMP/release-plan" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        path: tooling
        fetch-depth: 0
        persist-credentials: false
    - name: Preparer le parseur verrouille si une origine Git historique manque
      run: python tooling/tools/prepare-history-parser.py
    - name: Lire le bilan de publication
      id: request
      env:
        REQUEST_FILE: ${{ inputs.request_file }}
        REQUEST_JSON: ${{ inputs.request_json }}
      run: |-
        python tooling/tools/prepare-release-input.py "$PLAN"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ steps.request.outputs.candidate }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      timeout-minutes: 3
      with:
        node-version: '22.23.5'
        check-latest: false
        cache: npm
        cache-dependency-path: |
          candidate/functions/package-lock.json
          candidate/tests/firestore-rules/package-lock.json
          tooling/tests/firestore-rules/package-lock.json
    - name: Reutiliser la CI du candidat exact
      id: candidate-ci
      env:
        GITHUB_SHA: ${{ steps.request.outputs.candidate }}
      run: python tooling/tools/test-verification-evidence.py reuse "$RUNNER_TEMP/candidate-ci-proof"
    - name: Verifier le candidat exact
      run: |-
        cd candidate
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        test -z "$(git status --porcelain)"
        if [ "$MAIN_VERIFIED" != true ]; then
          npm ci --prefix functions
          npm ci --prefix tests/firestore-rules
          node tools/verify-livepalmes.js
        fi
      env:
        CANDIDATE_SHA: ${{ steps.request.outputs.candidate }}
        MAIN_VERIFIED: ${{ steps.candidate-ci.outputs.verified }}
    - name: Installer les dependances du lecteur d empreintes
      run: npm ci --prefix tooling/tests/firestore-rules --ignore-scripts --prefer-offline --no-audit --no-fund
    - name: Reutiliser la CI du circuit exact
      id: tooling-ci
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: python tooling/tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/tooling-ci-proof"
    - name: Verifier le circuit de publication
      if: steps.tooling-ci.outputs.verified != 'true'
      run: node tooling/tools/run-verification-tests.js publicationFallback

    - name: Verifier la preuve de publication TEST
      run: |-
        python tooling/tools/release-cycle.py verify-test-evidence "$PLAN"
        python tooling/tools/release-cycle.py selection "$PLAN" candidate
    - name: Figer le bilan depuis les preuves PROD
      run: python tooling/tools/release-cycle.py freeze-evidence "$PLAN"
    - name: Figer le parallelisme depuis la mesure TEST authentifiee
      env:
        SOURCE_BENCHMARK_RUN: ${{ inputs.source_benchmark_run }}
      run: python tooling/tools/release-source-parallelism.py "$PLAN"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-plan
        path: ${{ runner.temp }}/release-plan/*.json
        if-no-files-found: error
        retention-days: 14
    - name: Distinguer installations et tests
      if: always()
      timeout-minutes: 1
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -f "tooling/tools/ci-runtime.py" ]; then
          python "tooling/tools/ci-runtime.py" timings
        else
          echo "Mesure indisponible pour ce candidat historique ; controles inchanges." >> "$GITHUB_STEP_SUMMARY"
        fi

  session-enforcement-completion:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.session_enforcement_completion && inputs.source_benchmark_run == '0' && !inputs.optional_access_completion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
          cache: npm
          cache-dependency-path: tooling/tests/firestore-rules/package-lock.json
      - name: Installer le lecteur d empreintes verrouille
        run: npm ci --prefix tooling/tests/firestore-rules --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Reutiliser la CI du circuit exact
        id: tooling-ci
        run: python tooling/tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/completion-tooling-ci"
      - name: Conserver le repli de verification du circuit
        if: steps.tooling-ci.outputs.verified != 'true'
        run: node tooling/tools/run-verification-tests.js publicationFallback
      - name: Authentifier le complement et les preuves initiales sans Google
        env:
          REQUEST_FILE: ${{ inputs.request_file }}
          REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          test "$REQUEST_FILE" = '.github/releases/20261117-a34-session-enforcement-completion.json'
          test -z "$REQUEST_JSON"
          python tooling/tools/portal-session-enforcement-completion.py preflight "$RUNNER_TEMP/release-plan" tooling/.github/releases/20261117-a34-session-enforcement-completion.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Distinguer installations et tests
        if: always()
        timeout-minutes: 1
        run: python tooling/tools/ci-runtime.py timings

  optional-access-completion:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.optional_access_completion && !inputs.session_enforcement_completion && inputs.source_benchmark_run == '0' && inputs.request_json == '' && inputs.request_file == '.github/releases/20261118-a3-optional-access-completion.json'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPTIONAL_ACCESS_COMPLETION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          check-latest: false
          cache: npm
          cache-dependency-path: tests/firestore-rules/package-lock.json
      - name: Installer le lecteur d empreintes deja verrouille
        run: npm ci --prefix tests/firestore-rules --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Authentifier la CI publication du controleur exact
        id: ci
        run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/ci-proof"
      - name: Exiger cette preuve avant le complement
        run: test '${{ steps.ci.outputs.verified }}' = true
      - name: Preparer le plan ferme depuis les sources deja attestees
        run: python tools/optional-access-production-completion.py preflight "$RUNNER_TEMP/release-plan" .github/releases/20261118-a3-optional-access-completion.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan/*.json
          if-no-files-found: error
          retention-days: 14
