name: Preparer le bilan PROD sans deployer
'on':
  workflow_dispatch:
    inputs:
      request_file:
        description: Fichier .github/releases/*.json contenant le bilan valide
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Initialiser les chemins temporaires
      run: |
        echo "PLAN=$RUNNER_TEMP/release-plan" >> "$GITHUB_ENV"
    - uses: actions/checkout@v7
      with:
        path: tooling
        fetch-depth: 0
        persist-credentials: false
    - name: Lire le bilan de publication
      id: request
      env:
        REQUEST_FILE: ${{ inputs.request_file }}
      run: |-
        [[ "$REQUEST_FILE" =~ ^\.github/releases/[A-Za-z0-9_-]+\.json$ ]]
        python tooling/tools/release-cycle.py request "tooling/$REQUEST_FILE" "$PLAN"
    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.request.outputs.candidate }}
        path: candidate
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Verifier le candidat exact
      run: |-
        npm ci --prefix candidate/functions
        npm ci --prefix candidate/tests/firestore-rules
        cd candidate
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        test -z "$(git status --porcelain)"
        node tools/verify-livepalmes.js
      env:
        CANDIDATE_SHA: ${{ steps.request.outputs.candidate }}
    - name: Verifier le circuit de publication
      run: |-
        npm ci --prefix tooling/tests/firestore-rules --ignore-scripts
        node tooling/tests/release-function-fingerprints-tests.js
        python tooling/tests/release-cycle-tests.py
        python tooling/tests/production-pdf-functions-tests.py
        python tooling/tests/production-release-state-tests.py
        node tooling/tests/production-backup-crypto-tests.js
    - name: Verifier la preuve de publication TEST
      run: |-
        python tooling/tools/release-cycle.py verify-test-evidence "$PLAN"
        python tooling/tools/release-cycle.py selection "$PLAN" candidate
    - name: Figer le bilan depuis les preuves PROD
      run: python tooling/tools/release-cycle.py freeze-evidence "$PLAN"
    - uses: actions/upload-artifact@v4
      with:
        name: release-plan
        path: ${{ runner.temp }}/release-plan/*.json
        if-no-files-found: error
        retention-days: 14
