name: Preparer le bilan PROD sans deployer
'on':
  workflow_dispatch:
    inputs:
      request_file:
        description: Fichier .github/releases/*.json contenant le bilan valide
        required: false
        type: string
      request_json:
        description: Bilan JSON complet, alternative au fichier versionne (64 Kio maximum)
        required: false
        type: string
      source_benchmark_run:
        description: Run TEST comparant 3/6 builds, sinon 0 (trois builds conserves)
        required: false
        type: string
        default: '0'
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Initialiser les chemins temporaires
      run: |
        echo "PLAN=$RUNNER_TEMP/release-plan" >> "$GITHUB_ENV"
    - uses: actions/checkout@v7
      with:
        path: tooling
        fetch-depth: 0
        persist-credentials: false
    - name: Lire le bilan de publication
      id: request
      env:
        REQUEST_FILE: ${{ inputs.request_file }}
        REQUEST_JSON: ${{ inputs.request_json }}
      run: |-
        python tooling/tools/prepare-release-input.py "$PLAN"
    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.request.outputs.candidate }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |
          candidate/functions/package-lock.json
          candidate/tests/firestore-rules/package-lock.json
          tooling/tests/firestore-rules/package-lock.json
    - name: Reutiliser la CI du candidat exact
      id: candidate-ci
      env:
        GITHUB_SHA: ${{ steps.request.outputs.candidate }}
      run: python tooling/tools/test-verification-evidence.py reuse "$RUNNER_TEMP/candidate-ci-proof"
    - name: Verifier le candidat exact
      run: |-
        cd candidate
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        test -z "$(git status --porcelain)"
        if [ "$MAIN_VERIFIED" != true ]; then
          npm ci --prefix functions
          npm ci --prefix tests/firestore-rules
          node tools/verify-livepalmes.js
        fi
      env:
        CANDIDATE_SHA: ${{ steps.request.outputs.candidate }}
        MAIN_VERIFIED: ${{ steps.candidate-ci.outputs.verified }}
    - name: Installer les dependances du lecteur d empreintes
      run: npm ci --prefix tooling/tests/firestore-rules --ignore-scripts --prefer-offline --no-audit --no-fund
    - name: Reutiliser la CI du circuit exact
      id: tooling-ci
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: python tooling/tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/tooling-ci-proof"
    - name: Verifier le circuit de publication
      if: steps.tooling-ci.outputs.verified != 'true'
      run: |-
        node tooling/tests/release-function-fingerprints-tests.js
        python tooling/tests/release-cycle-tests.py
        python tooling/tests/release-preflight-review-tests.py
        node tooling/tests/release-excluded-backend-compatibility-tests.js
        node tooling/tests/release-c0-compatibility-tests.js
        node tooling/tests/release-home-compatibility-tests.js
        python tooling/tests/release-composed-evidence-tests.py
        python tooling/tests/production-pdf-functions-tests.py
        python tooling/tests/production-release-state-tests.py
        python tooling/tests/production-grouped-release-tests.py
        python tooling/tests/bcc-publication-tests.py
        python tooling/tests/all-validated-publication-tests.py
        python tooling/tests/validated-20261026-publication-tests.py
        python tooling/tests/validated-20261027-publication-tests.py
        python tooling/tests/production-account-history-indexes-tests.py
        node tooling/tests/nap-national-documents-callable-tests.js
        python tooling/tests/production-notification-release-tests.py
        python tooling/tests/production-access-request-release-tests.py
        node tooling/tests/production-notification-preparation-tests.js
        node tooling/tests/production-backup-crypto-tests.js
        python tooling/tests/publication-fast-paths-tests.py
        python tooling/tests/release-simplification-tests.py
        python tooling/tests/license-report-release-tests.py
        node tooling/tests/license-report-source-guard-tests.js
    - name: Verifier la preuve de publication TEST
      run: |-
        python tooling/tools/release-cycle.py verify-test-evidence "$PLAN"
        python tooling/tools/release-cycle.py selection "$PLAN" candidate
    - name: Figer le bilan depuis les preuves PROD
      run: python tooling/tools/release-cycle.py freeze-evidence "$PLAN"
    - name: Figer le parallelisme depuis la mesure TEST authentifiee
      env:
        SOURCE_BENCHMARK_RUN: ${{ inputs.source_benchmark_run }}
      run: python tooling/tools/release-source-parallelism.py "$PLAN"
    - uses: actions/upload-artifact@v4
      with:
        name: release-plan
        path: ${{ runner.temp }}/release-plan/*.json
        if-no-files-found: error
        retention-days: 14
