name: Assembler le bilan de la version validee
on:
  workflow_dispatch:
    inputs:
      test_run:
        description: Run TEST reussi de la version a figer
        required: true
        type: string
      diagnostic_only:
        description: Diagnostiquer les sources et exclusions depuis TEST, avant validation humaine
        required: false
        default: false
        type: boolean
      validations_json:
        description: Retours utilisateur explicites, requis pour assembler un dossier de publication
        required: false
        type: string
      sources_authorization_json:
        description: Accord sources/labels optionnel avec candidat exact, fonctions et message humain source
        required: false
        default: ''
        type: string
      reuse_evidence_json:
        description: References facultatives preflightRun et prerequisitesRun du meme dossier
        required: false
        default: '{}'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  draft:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Installer les dependances verrouillees du lecteur d empreintes
        run: npm ci --prefix tests/firestore-rules --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Assembler les preuves sans acces Firebase ni publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RUN: ${{ inputs.test_run }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          VALIDATIONS_JSON: ${{ inputs.validations_json }}
          SOURCES_AUTHORIZATION_JSON: ${{ inputs.sources_authorization_json }}
          REUSE_EVIDENCE_JSON: ${{ inputs.reuse_evidence_json }}
        run: python tools/prepare-release-draft.py "$RUNNER_TEMP/release-draft"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-draft
          path: |
            ${{ runner.temp }}/release-draft/request-draft.json
            ${{ runner.temp }}/release-draft/draft-status.json
            ${{ runner.temp }}/release-draft/delivery-state.json
            ${{ runner.temp }}/release-draft/full-diff.json
            ${{ runner.temp }}/release-draft/prod-diagnostic.json
            ${{ runner.temp }}/release-draft/proof-decisions.json
            ${{ runner.temp }}/release-draft/standard-source-manifest.json
            ${{ runner.temp }}/release-draft/SUMMARY.md
          if-no-files-found: error
          retention-days: 14
