name: Ajouter le complements DTN NAP autorise
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      confirmation:
        description: nap-recover-dtn-settings, apres accord specifique
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nap-authorized-dtn-settings
  cancel-in-progress: false
jobs:
  create:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-test
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
      NAP_DTN_SETTINGS_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verifier le commit et la confirmation
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$NAP_DTN_SETTINGS_CONFIRMATION" = "nap-recover-dtn-settings"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - name: Sauvegarder les parametres DTN avant reprise
        env:
          NAP_DTN_SETTINGS_PHASE: prepare
        run: node tools/recover-nap-dtn-settings.js
      - name: Conserver la sauvegarde avant toute reprise
        uses: actions/upload-artifact@v4
        with:
          name: nap-dtn-settings-before
          path: outputs/nap-dtn-settings-before.json
          if-no-files-found: error
          retention-days: 90
      - name: Reprendre uniquement les parametres absents puis verifier
        env:
          NAP_DTN_SETTINGS_PHASE: apply
        run: node tools/recover-nap-dtn-settings.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nap-dtn-settings-result
          path: outputs/nap-dtn-settings-*.json
          if-no-files-found: ignore
          retention-days: 90
