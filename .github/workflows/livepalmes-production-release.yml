name: Publier la version approuvee en PROD
'on':
  workflow_dispatch:
    inputs:
      preparation_run:
        description: Run du bilan approuve (0 pour une reprise)
        required: true
        type: string
        default: '0'
      resume_run:
        description: Run de publication interrompu, sinon 0
        required: true
        type: string
        default: '0'
      confirmation:
        description: Accord explicite PROD sur le bilan presente
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirmation && vars.FIREBASE_PRODUCTION_ENABLED
      == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ runner.temp }}/release-plan
      TARGET_FIREBASE_PROJECT: livepalmes
      CANDIDATE_DIRECTORY: ${{ github.workspace }}/candidate
      RELEASE_SELECTION: ${{ runner.temp }}/release-plan/selection.json
      RELEASE_BACKUP_DIRECTORY: ${{ runner.temp }}/prod-backup
    steps:
    - uses: actions/checkout@v7
      with:
        path: tooling
        fetch-depth: 0
        persist-credentials: false
    - name: Recuperer le bilan immuable
      id: plan
      env:
        PREPARATION: ${{ inputs.preparation_run }}
        RESUME: ${{ inputs.resume_run }}
      run: python tooling/tools/release-cycle.py fetch-plan "$PREPARATION" "$RESUME" "$PLAN"
    - name: Fixer le commit et la cible
      run: 'echo "CANDIDATE_SHA=${{ steps.plan.outputs.candidate }}" >> "$GITHUB_ENV"

        version="$(jq -r .productionHosting "$PLAN/request.json")"

        echo "EXPECTED_HOSTING_VERSION=$version" >> "$GITHUB_ENV"'
    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.plan.outputs.candidate }}
        path: candidate
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Verifier le candidat exact
      run: 'npm ci --prefix candidate/functions

        npm ci --prefix candidate/tests/firestore-rules

        cd candidate

        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

        test -z "$(git status --porcelain)"

        node tools/verify-livepalmes.js'
    - name: Verifier le circuit de publication
      run: 'python tooling/tests/release-cycle-tests.py

        python tooling/tests/production-release-state-tests.py

        node tooling/tests/production-backup-crypto-tests.js'
    - uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - uses: google-github-actions/setup-gcloud@v3
    - name: Verifier que PROD correspond encore au bilan
      if: inputs.resume_run == '0'
      run: python tooling/tools/release-cycle.py compare-prod "$PLAN"
    - name: Sauvegarder le code PROD avant publication
      id: backup
      if: inputs.resume_run == '0'
      run: python tooling/tools/preflight-production-release.py
    - name: Chiffrer puis tester la sauvegarde
      if: inputs.resume_run == '0'
      run: 'node tooling/tools/production-backup-crypto.js seal "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/prod-backup.enc"

        node tooling/tools/production-backup-crypto.js open "$RUNNER_TEMP/prod-backup.enc" "$RUNNER_TEMP/backup-verification"

        diff -qr "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/backup-verification"'
    - name: Ouvrir la sauvegarde initiale pour une reprise
      if: inputs.resume_run != '0'
      run: 'cp "$PLAN/encrypted/prod-backup.enc" "$RUNNER_TEMP/prod-backup.enc"

        node tooling/tools/production-backup-crypto.js open "$RUNNER_TEMP/prod-backup.enc" "$RUNNER_TEMP/prod-backup"

        python tooling/tools/release-cycle.py verify-resume "$PLAN" "$RUNNER_TEMP/prod-backup"'
      id: resume
    - name: Associer les controles au commit
      run: 'python - <<''PYCODE''

        import json, os

        from pathlib import Path

        p=Path(os.environ[''RUNNER_TEMP''])/''prod-backup/report.json''

        r=json.loads(p.read_text()); r[''commitLabel'']=True; p.write_text(json.dumps(r))

        with open(os.environ[''GITHUB_ENV''],''a'') as out: out.write(''APP_CHECK=''+r[''appCheck'']+''\n'')

        PYCODE'
    - uses: actions/upload-artifact@v4
      with:
        name: release-plan
        path: ${{ runner.temp }}/release-plan/*.json
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: production-code-backup
        path: ${{ runner.temp }}/prod-backup.enc
        if-no-files-found: error
        retention-days: 14
    - name: Preparer les Functions selectionnees
      if: steps.plan.outputs.backend == 'true'
      run: 'python tooling/tools/release-cycle.py stage candidate livepalmes "$RUNNER_TEMP/production-functions" "$CANDIDATE_SHA"

        npm ci --prefix "$RUNNER_TEMP/production-functions/functions"'
    - name: Simuler les Functions par petits lots
      if: steps.plan.outputs.backend == 'true'
      run: python tooling/tools/release-cycle.py batches livepalmes candidate "$RUNNER_TEMP/production-functions" "$RELEASE_SELECTION"
        dry-run
    - name: Publier les Functions par petits lots
      id: functions
      if: steps.plan.outputs.backend == 'true'
      continue-on-error: true
      run: python tooling/tools/release-cycle.py batches livepalmes candidate "$RUNNER_TEMP/production-functions" "$RELEASE_SELECTION"
        deploy
    - name: Controler toutes les Functions et les exclusions
      id: state
      env:
        DEPLOY_OUTCOME: ${{ steps.functions.outcome == 'failure' && 'failure' || 'success' }}
      if: always() && (steps.functions.outcome == 'success' || steps.functions.outcome == 'failure' || (steps.plan.outputs.backend
        == 'false' && (steps.backup.outcome == 'success' || steps.resume.outcome == 'success')))
      run: python tooling/tools/production-release-state.py check "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/production-after.json"
        "$DEPLOY_OUTCOME"
    - uses: actions/upload-artifact@v4
      with:
        name: production-after
        path: ${{ runner.temp }}/production-after.json
        if-no-files-found: error
        retention-days: 14
      if: always() && steps.state.outcome != 'skipped'
    - uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
      if: steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
    - name: Publier Hosting apres les controles
      id: hosting
      if: steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      run: 'node tooling/tools/check-hosting-payload.js candidate

        cd candidate

        tests/firestore-rules/node_modules/.bin/firebase deploy --project livepalmes --only hosting --non-interactive --message
        "LivePalmes $CANDIDATE_SHA run $GITHUB_RUN_ID"'
    - name: Controler les pages publiees
      if: steps.hosting.outcome == 'success'
      run: python tooling/tools/check-production-hosting.py candidate
    - name: Relever Hosting apres la tentative
      if: always() && (steps.hosting.outcome == 'success' || steps.hosting.outcome == 'failure')
      run: python tooling/tools/production-release-state.py hosting-state "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/production-hosting-after.json"
    - uses: actions/upload-artifact@v4
      with:
        name: production-hosting-after
        path: ${{ runner.temp }}/production-hosting-after.json
        if-no-files-found: error
        retention-days: 14
      if: always() && (steps.hosting.outcome == 'success' || steps.hosting.outcome == 'failure')
    - name: Conclure
      env:
        STATE: ${{ steps.state.outcome }}
        HOSTING: ${{ steps.hosting.outcome }}
      if: always()
      run: 'test "$STATE" = success

        test "$HOSTING" = success

        echo "Publication du commit $CANDIDATE_SHA terminee, code uniquement." >> "$GITHUB_STEP_SUMMARY"'
