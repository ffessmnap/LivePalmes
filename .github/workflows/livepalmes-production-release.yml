  session-enforcement-completion:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.session_enforcement_completion && inputs.resume_run == '0' && inputs.preparation_run != '0' && inputs.confirmation && vars.FIREBASE_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
