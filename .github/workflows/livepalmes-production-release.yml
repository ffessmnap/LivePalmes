        with:
          node-version: '22.23.5'
          check-latest: false
          cache: npm
          cache-dependency-path: candidate/tests/firestore-rules/package-lock.json
      - name: Preparer Hosting du candidat exact
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          npm ci --prefix candidate/tests/firestore-rules
          node tooling/tools/check-hosting-payload.js candidate
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
