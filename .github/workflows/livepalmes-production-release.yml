        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
          READINESS_RUN: ${{ inputs.readiness_run }}
        run: |
          set -euo pipefail
          python tooling/tools/portal-session-enforcement-completion.py fetch-plan "$PLAN" "$PLAN_RUN"
          python tooling/tools/portal-session-enforcement-completion.py require-readiness "$PLAN" "$READINESS_RUN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 689d523b423615cb1faad9f564c1a6b2f44f1b96
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
