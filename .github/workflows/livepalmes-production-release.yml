name: Publier la version approuvee en PROD
'on':
  workflow_dispatch:
    inputs:
      session_enforcement_completion:
        description: Complement ferme du seul run44099971258, sources deja attestees, aucune nouvelle source
        required: false
        type: boolean
        default: false
      preparation_run:
        description: Run du bilan approuve (0 pour une reprise)
        required: true
        type: string
        default: '0'
      readiness_run:
        description: Preuve officielle des prerequis (obligatoire pour le signal prive Direct)
        required: true
        type: string
        default: '0'
      resume_run:
        description: Run de publication interrompu, sinon 0
        required: true
        type: string
        default: '0'
      confirmation:
        description: Accord explicite PROD sur le bilan presente
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
env:
  npm_config_fetch_retries: '2'
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retry_mintimeout: '1000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.session_enforcement_completion && inputs.confirmation && vars.FIREBASE_PRODUCTION_ENABLED
      == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PREPARATION_RUN: ${{ inputs.preparation_run }}
      RESUME: ${{ inputs.resume_run }}
      A33_RECOVERY_RUN: ${{ inputs.resume_run }}
      A33_RECOVERY_READINESS_RUN: ${{ inputs.readiness_run }}
      TARGET_FIREBASE_PROJECT: livepalmes
      CANDIDATE_DIRECTORY: ${{ github.workspace }}/candidate
    steps:
    - name: Initialiser les chemins temporaires
      run: |
        echo "PLAN=$RUNNER_TEMP/release-plan" >> "$GITHUB_ENV"
        echo "RELEASE_SELECTION=$RUNNER_TEMP/release-plan/selection.json" >> "$GITHUB_ENV"
        echo "RELEASE_BACKUP_DIRECTORY=$RUNNER_TEMP/prod-backup" >> "$GITHUB_ENV"
        echo "NOVEMBER_RELEASE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        path: tooling
        fetch-depth: 0
        persist-credentials: false
    - name: Recuperer le bilan immuable
      id: plan
      env:
        PREPARATION: ${{ inputs.preparation_run }}
        RESUME: ${{ inputs.resume_run }}
      run: python tooling/tools/release-cycle.py fetch-plan "$PREPARATION" "$RESUME" "$PLAN"
    - name: Authentifier les prerequis officiels du seul contrat HTTP A3.6a
      run: python tooling/tools/http-headers-production-policy.py readiness "$PLAN" "$PREPARATION_RUN" "${{ inputs.readiness_run }}"
    - name: Authentifier les prerequis officiels du seul contrat CSP A3.6b
      run: python tooling/tools/direct-csp-production-policy.py readiness "$PLAN" "$PREPARATION_RUN" "${{ inputs.readiness_run }}"
    - name: Authentifier les prerequis officiels du bootstrap compatible A3.4a
      run: python tooling/tools/portal-session-prepare-production-policy.py readiness "$PLAN" "$PREPARATION_RUN" "${{ inputs.readiness_run }}"
    - name: Authentifier les prerequis officiels de A3.4a B
      run: python tooling/tools/portal-session-enforcement-production-policy.py readiness "$PLAN" "$PREPARATION_RUN" "${{ inputs.readiness_run }}"
    - name: Authentifier les prerequis du contrat facultatif App Check et droits courants
      run: python tooling/tools/optional-access-production-policy.py readiness "$PLAN" "$PREPARATION_RUN" "${{ inputs.readiness_run }}"
    - name: Fixer le commit et la cible
      run: 'echo "CANDIDATE_SHA=${{ steps.plan.outputs.candidate }}" >> "$GITHUB_ENV"

        version="$(jq -r .productionHosting "$PLAN/request.json")"

        echo "EXPECTED_HOSTING_VERSION=$version" >> "$GITHUB_ENV"'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ steps.plan.outputs.candidate }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      timeout-minutes: 3
      with:
        node-version: '22.23.5'
        check-latest: false
        cache: npm
        cache-dependency-path: |
          candidate/functions/package-lock.json
          candidate/tests/firestore-rules/package-lock.json
          tooling/tests/firestore-rules/package-lock.json
    - name: Verifier le candidat exact
      env:
        TEST_VERIFIED: ${{ steps.plan.outputs.verified }}
      run: |
        npm ci --prefix candidate/tests/firestore-rules
        cd candidate
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        test -z "$(git status --porcelain)"
        if [ "$TEST_VERIFIED" = true ]; then
          echo "Verification applicative reutilisee depuis la preuve TEST du commit exact." >> "$GITHUB_STEP_SUMMARY"
        else
          npm ci --prefix functions
          node tools/verify-livepalmes.js
        fi
    - name: Installer les dependances du lecteur d empreintes
      run: npm ci --prefix tooling/tests/firestore-rules --ignore-scripts --prefer-offline --no-audit --no-fund
    - name: Reutiliser la CI du circuit exact
      id: tooling-ci
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: python tooling/tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/tooling-ci-proof"
    - name: Verifier le circuit de publication
      if: steps.tooling-ci.outputs.verified != 'true'
      run: node tooling/tools/run-verification-tests.js publicationFallback

    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      if: inputs.resume_run == '0' || steps.plan.outputs.access_revocation_reader == 'true'
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
        project_id: livepalmes-test
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      if: inputs.resume_run == '0' || steps.plan.outputs.access_revocation_reader == 'true'
    - name: Relire TEST avant toute ecriture PROD
      if: inputs.resume_run == '0' || steps.plan.outputs.access_revocation_reader == 'true'
      run: python tooling/tools/release-cycle.py verify-test "$PLAN"
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
    - name: Utiliser le lecteur Auth existant A3.3 avant publication
      if: steps.plan.outputs.access_revocation_reader == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
    - name: Qualifier la continuite administrative A3.3 avant publication
      if: steps.plan.outputs.access_revocation_reader == 'true'
      run: python tooling/tools/access-revocation-production-policy.py "$PLAN" auth-before
    - name: Restaurer le compte backend A3.3 avant sauvegarde et sources
      if: always() && steps.plan.outputs.access_revocation_reader == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - name: Utiliser le lecteur administratif existant pour le lot facultatif
      if: steps.plan.outputs.optional_access_reader == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
    - name: Qualifier la continuite et les Rules conservees avant sauvegarde
      if: steps.plan.outputs.optional_access_reader == 'true'
      run: python tooling/tools/optional-access-production-policy.py auth-before "$PLAN"
    - name: Restaurer le compte backend facultatif avant sauvegarde et sources
      if: always() && steps.plan.outputs.optional_access_reader == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - name: Utiliser le lecteur administratif existant pour A3.4a A
      if: steps.plan.outputs.portal_session_prepare_reader == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
    - name: Qualifier la continuite administrative A3.4a avant sauvegarde
      if: steps.plan.outputs.portal_session_prepare_reader == 'true'
      run: python tooling/tools/portal-session-prepare-production-policy.py auth-before "$PLAN"
    - name: Restaurer le compte backend A3.4a avant sauvegarde et sources
      if: always() && steps.plan.outputs.portal_session_prepare_reader == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - name: Utiliser le lecteur administratif existant pour A3.4a B
      if: steps.plan.outputs.portal_session_enforcement_reader == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
    - name: Qualifier la continuite administrative A3.4a B avant sauvegarde
      if: steps.plan.outputs.portal_session_enforcement_reader == 'true'
      run: python tooling/tools/portal-session-enforcement-production-policy.py auth-before "$PLAN"
    - name: Restaurer le compte backend A3.4a B avant sauvegarde et sources
      if: always() && steps.plan.outputs.portal_session_enforcement_reader == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - name: Verifier que PROD correspond encore au bilan
      if: inputs.resume_run == '0'
      run: python tooling/tools/release-cycle.py compare-prod "$PLAN"
    - name: Installer le lecteur borne des bilans licences
      if: steps.plan.outputs.license_reports == 'true'
      run: npm ci --prefix tooling/functions --ignore-scripts --prefer-offline --no-audit --no-fund
    - name: Verifier les mails desactives avant la bascule NAP
      # The closed licence scope keeps mail active and reads the official source only.
      run: python tooling/tools/check-production-mail-disabled.py
    - name: Sauvegarder le code PROD avant publication
      id: backup
      if: inputs.resume_run == '0'
      run: python tooling/tools/preflight-production-release.py
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      if: inputs.resume_run == '0' && steps.plan.outputs.direct_realtime_rules == 'true'
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
    - name: Sauvegarder les seules regles privees Direct depuis la base PROD attestee
      if: inputs.resume_run == '0' && steps.plan.outputs.direct_realtime_rules == 'true'
      env:
        READINESS_RUN: ${{ inputs.readiness_run }}
      run: python tooling/tools/direct-realtime-production-rules.py backup "$PLAN" "$RELEASE_BACKUP_DIRECTORY" "$READINESS_RUN"
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      if: inputs.resume_run == '0' && steps.plan.outputs.direct_realtime_rules == 'true'
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - name: Utiliser le lecteur Rules existant pour sauvegarder B
      if: inputs.resume_run == '0' && steps.plan.outputs.portal_session_enforcement_rules == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
    - name: Sauvegarder les seules regles PROD initiales de B
      if: inputs.resume_run == '0' && steps.plan.outputs.portal_session_enforcement_rules == 'true'
      env:
        READINESS_RUN: ${{ inputs.readiness_run }}
      run: python tooling/tools/portal-session-enforcement-production-rules.py backup "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
    - name: Restaurer backend apres sauvegarde Rules B
      if: always() && inputs.resume_run == '0' && steps.plan.outputs.portal_session_enforcement_rules == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - name: Chiffrer puis tester la sauvegarde
      id: encrypted_backup
      if: inputs.resume_run == '0'
      env:
        LIVEPALMES_CODE_BACKUP_KEY_V2: ${{ secrets.LIVEPALMES_CODE_BACKUP_KEY_V2 }}
      run: |
        node tooling/tools/production-code-backup-archive.js seal "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/prod-backup.enc"
        node tooling/tools/production-code-backup-archive.js open-v2 "$RUNNER_TEMP/prod-backup.enc" "$RUNNER_TEMP/backup-verification" "$PLAN/request.json"
        diff -qr "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/backup-verification"
    - name: Attester le producteur initial apres comparaison exacte
      if: inputs.resume_run == '0'
      run: node tooling/tools/production-code-backup-archive.js emit-link "$RUNNER_TEMP/prod-backup.enc" "$PLAN" "$PLAN/request.json"
    - name: Identifier sans cle le format de sauvegarde reprise
      id: resume_backup_format
      if: inputs.resume_run != '0'
      run: |
        archive_format="$(node tooling/tools/production-code-backup-archive.js inspect "$PLAN/encrypted/prod-backup.enc")"
        echo "format=$archive_format" >> "$GITHUB_OUTPUT"
    - name: Verifier sans cle la provenance du run source V2
      if: inputs.resume_run != '0' && steps.resume_backup_format.outputs.format == 'v2'
      run: node tooling/tools/production-code-backup-archive.js validate-source "$PLAN/encrypted/prod-backup.enc" "$PLAN" "$PLAN/request.json" "$RUNNER_TEMP/code-backup-source.json"
    - name: Ouvrir V2 en conservant le contexte de creation initial
      if: inputs.resume_run != '0' && steps.resume_backup_format.outputs.format == 'v2'
      env:
        LIVEPALMES_CODE_BACKUP_KEY_V2: ${{ secrets.LIVEPALMES_CODE_BACKUP_KEY_V2 }}
      run: |
        test ! -e "$RUNNER_TEMP/prod-backup.enc"
        test ! -e "$RUNNER_TEMP/code-backup-context.json"
        cp "$PLAN/encrypted/prod-backup.enc" "$RUNNER_TEMP/prod-backup.enc"
        cp "$PLAN/encrypted/code-backup-context.json" "$RUNNER_TEMP/code-backup-context.json"
        node tooling/tools/production-code-backup-archive.js open-v2 "$RUNNER_TEMP/prod-backup.enc" "$RUNNER_TEMP/prod-backup" "$PLAN/request.json" "$RUNNER_TEMP/code-backup-source.json"
    - name: Ouvrir seulement une archive historique V1 explicite
      if: inputs.resume_run != '0' && steps.resume_backup_format.outputs.format == 'legacy-v1'
      env:
        LIVEPALMES_CODE_BACKUP_LEGACY_V1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
      run: |
        test ! -e "$RUNNER_TEMP/prod-backup.enc"
        test ! -e "$RUNNER_TEMP/code-backup-context.json"
        cp "$PLAN/encrypted/prod-backup.enc" "$RUNNER_TEMP/prod-backup.enc"
        node tooling/tools/production-code-backup-archive.js open-legacy-v1 "$RUNNER_TEMP/prod-backup.enc" "$RUNNER_TEMP/prod-backup"
    - name: Verifier la sauvegarde reprise avant toute publication
      if: inputs.resume_run != '0'
      run: python tooling/tools/release-cycle.py verify-resume "$PLAN" "$RUNNER_TEMP/prod-backup"
      id: resume
    - name: Attester la copie V2 apres validation de reprise
      if: inputs.resume_run != '0' && steps.resume_backup_format.outputs.format == 'v2'
      run: node tooling/tools/production-code-backup-archive.js emit-link "$RUNNER_TEMP/prod-backup.enc" "$PLAN" "$PLAN/request.json" "$RUNNER_TEMP/code-backup-source.json"
    - name: Associer les controles au commit
      run: 'python - <<''PYCODE''

        import json, os

        from pathlib import Path

        p=Path(os.environ[''RUNNER_TEMP''])/''prod-backup/report.json''

        r=json.loads(p.read_text()); r[''commitLabel'']=True; p.write_text(json.dumps(r))

        with open(os.environ[''GITHUB_ENV''],''a'') as out: out.write(''APP_CHECK=''+r[''appCheck'']+''\n'')

        PYCODE'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-plan
        path: ${{ runner.temp }}/release-plan/*.json
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: production-code-backup
        path: |
          ${{ runner.temp }}/prod-backup.enc
          ${{ runner.temp }}/code-backup-context.json
        if-no-files-found: error
        retention-days: 14
    - name: Preparer les Functions selectionnees
      if: steps.plan.outputs.backend == 'true' && steps.plan.outputs.bcc_preservation != 'true' && steps.plan.outputs.nap_account != 'true' && steps.plan.outputs.preserved_sources_only != 'true'
      run: 'python tooling/tools/release-cycle.py stage candidate livepalmes "$RUNNER_TEMP/production-functions" "$CANDIDATE_SHA"

        npm ci --prefix "$RUNNER_TEMP/production-functions/functions"'
    - name: Simuler les Functions par petits lots
      if: steps.plan.outputs.backend == 'true' && steps.plan.outputs.bcc_preservation != 'true' && steps.plan.outputs.nap_account != 'true' && steps.plan.outputs.preserved_sources_only != 'true'
      run: python tooling/tools/release-cycle.py batches livepalmes candidate "$RUNNER_TEMP/production-functions" "$RELEASE_SELECTION"
        dry-run
    - name: Publier les Functions par petits lots
      id: functions
      if: steps.plan.outputs.backend == 'true'
      continue-on-error: true
      run: |
        set -euo pipefail
        python tooling/tools/standard-source-publish.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
        python tooling/tools/november-validated-release-policy.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
        python tooling/tools/november10-validated-release-policy.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
        python tooling/tools/reference-cleanup-production-policy.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
        python tooling/tools/public-navigation-direct-production-policy.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
        python tooling/tools/direct-reliability-production-policy.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
        python tooling/tools/direct-realtime-production-policy.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
        python tooling/tools/public-navigation-touch-production-policy.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
        python tooling/tools/release-cycle.py batches livepalmes candidate "$RUNNER_TEMP/production-functions" "$RELEASE_SELECTION" deploy
        python tooling/tools/publish-approved-pdf-functions.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
    - name: Controler toutes les Functions et les exclusions
      id: state
      env:
        DEPLOY_OUTCOME: ${{ steps.functions.outcome == 'failure' && 'failure' || 'success' }}
      if: always() && (steps.functions.outcome == 'success' || steps.functions.outcome == 'failure' || (steps.plan.outputs.backend
        == 'false' && (steps.backup.outcome == 'success' || steps.resume.outcome == 'success')))
      run: python tooling/tools/direct-csp-production-state.py check "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/production-after.json"
        "$DEPLOY_OUTCOME"
    - name: Confirmer les mails desactives avant Hosting
      if: steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      run: |
        python tooling/tools/check-production-mail-disabled.py
        python tooling/tools/check-production-nap-runtime.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: production-after
        path: ${{ runner.temp }}/production-after.json
        if-no-files-found: error
        retention-days: 14
      if: always() && steps.state.outcome != 'skipped'
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
      if: steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
    - name: Requalifier la continuite administrative A3.3 apres sources
      if: steps.plan.outputs.access_revocation_reader == 'true' && steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      run: python tooling/tools/access-revocation-production-policy.py "$PLAN" auth-after
    - name: Requalifier la continuite administrative A3.4a apres sources
      if: steps.plan.outputs.portal_session_prepare_reader == 'true' && steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      run: python tooling/tools/portal-session-prepare-production-policy.py auth-after "$PLAN"
    - name: Requalifier la continuite administrative B apres sources
      if: steps.plan.outputs.portal_session_enforcement_reader == 'true' && steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      run: python tooling/tools/portal-session-enforcement-production-policy.py auth-after "$PLAN"
    - name: Requalifier la continuite et les Rules apres les sources facultatives
      if: steps.plan.outputs.optional_access_reader == 'true' && steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      run: python tooling/tools/optional-access-production-policy.py auth-after "$PLAN"
    - name: Utiliser le compte backend pour conclure les temoins facultatifs
      if: always() && steps.plan.outputs.optional_access_reader == 'true' && steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - name: Confirmer les mails et runtimes facultatifs apres sources
      id: optional_access_after
      if: steps.plan.outputs.optional_access_reader == 'true' && steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      run: python tooling/tools/optional-access-production-policy.py guard-after "$PLAN"
    - name: Restaurer le lecteur Hosting apres les temoins facultatifs
      if: always() && steps.plan.outputs.optional_access_reader == 'true' && steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
