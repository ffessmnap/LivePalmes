name: Publier la version approuvee en PROD
'on':
  workflow_dispatch:
    inputs:
      preparation_run:
        description: Run du bilan approuve (0 pour une reprise)
        required: true
        type: string
        default: '0'
      resume_run:
        description: Run de publication interrompu, sinon 0
        required: true
        type: string
        default: '0'
      confirmation:
        description: Accord explicite PROD sur le bilan presente
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirmation && vars.FIREBASE_PRODUCTION_ENABLED
      == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_FIREBASE_PROJECT: livepalmes
      CANDIDATE_DIRECTORY: ${{ github.workspace }}/candidate
    steps:
    - name: Initialiser les chemins temporaires
      run: |
        echo "PLAN=$RUNNER_TEMP/release-plan" >> "$GITHUB_ENV"
        echo "RELEASE_SELECTION=$RUNNER_TEMP/release-plan/selection.json" >> "$GITHUB_ENV"
        echo "RELEASE_BACKUP_DIRECTORY=$RUNNER_TEMP/prod-backup" >> "$GITHUB_ENV"
    - uses: actions/checkout@v7
      with:
        path: tooling
        fetch-depth: 0
        persist-credentials: false
    - name: Recuperer le bilan immuable
      id: plan
      env:
        PREPARATION: ${{ inputs.preparation_run }}
        RESUME: ${{ inputs.resume_run }}
      run: python tooling/tools/release-cycle.py fetch-plan "$PREPARATION" "$RESUME" "$PLAN"
    - name: Fixer le commit et la cible
      run: 'echo "CANDIDATE_SHA=${{ steps.plan.outputs.candidate }}" >> "$GITHUB_ENV"

        version="$(jq -r .productionHosting "$PLAN/request.json")"

        echo "EXPECTED_HOSTING_VERSION=$version" >> "$GITHUB_ENV"'
    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.plan.outputs.candidate }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |
          candidate/functions/package-lock.json
          candidate/tests/firestore-rules/package-lock.json
          tooling/tests/firestore-rules/package-lock.json
    - name: Verifier le candidat exact
      env:
        TEST_VERIFIED: ${{ steps.plan.outputs.verified }}
      run: |
        npm ci --prefix candidate/tests/firestore-rules
        cd candidate
        test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
        test -z "$(git status --porcelain)"
        if [ "$TEST_VERIFIED" = true ]; then
          echo "Verification applicative reutilisee depuis la preuve TEST du commit exact." >> "$GITHUB_STEP_SUMMARY"
        else
          npm ci --prefix functions
          node tools/verify-livepalmes.js
        fi
    - name: Installer les dependances du lecteur d empreintes
      run: npm ci --prefix tooling/tests/firestore-rules --ignore-scripts --prefer-offline --no-audit --no-fund
    - name: Reutiliser la CI du circuit exact
      id: tooling-ci
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: python tooling/tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/tooling-ci-proof"
    - name: Verifier le circuit de publication
      if: steps.tooling-ci.outputs.verified != 'true'
      run: |
        node tooling/tests/release-function-fingerprints-tests.js
        python tooling/tests/release-cycle-tests.py
        python tooling/tests/release-preflight-review-tests.py
        node tooling/tests/release-excluded-backend-compatibility-tests.js
        node tooling/tests/release-c0-compatibility-tests.js
        node tooling/tests/release-home-compatibility-tests.js
        python tooling/tests/release-composed-evidence-tests.py
        python tooling/tests/production-pdf-functions-tests.py
        python tooling/tests/production-release-state-tests.py
        python tooling/tests/production-grouped-release-tests.py
        python tooling/tests/bcc-publication-tests.py
        python tooling/tests/all-validated-publication-tests.py
        python tooling/tests/validated-20261026-publication-tests.py
        python tooling/tests/validated-20261027-publication-tests.py
        python tooling/tests/production-account-history-indexes-tests.py
        node tooling/tests/nap-national-documents-callable-tests.js
        python tooling/tests/production-notification-release-tests.py
        python tooling/tests/production-access-request-release-tests.py
        node tooling/tests/production-notification-preparation-tests.js
        node tooling/tests/production-backup-crypto-tests.js
        python tooling/tests/publication-fast-paths-tests.py
        python tooling/tests/release-simplification-tests.py
        python tooling/tests/license-report-release-tests.py
        node tooling/tests/license-report-source-guard-tests.js
    - uses: google-github-actions/auth@v3
      if: inputs.resume_run == '0'
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
        project_id: livepalmes-test
    - uses: google-github-actions/setup-gcloud@v3
      if: inputs.resume_run == '0'
    - name: Relire TEST avant toute ecriture PROD
      if: inputs.resume_run == '0'
      run: python tooling/tools/release-cycle.py verify-test "$PLAN"
    - uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - uses: google-github-actions/setup-gcloud@v3
    - name: Verifier que PROD correspond encore au bilan
      if: inputs.resume_run == '0'
      run: python tooling/tools/release-cycle.py compare-prod "$PLAN"
    - name: Installer le lecteur borne des bilans licences
      if: steps.plan.outputs.license_reports == 'true'
      run: npm ci --prefix tooling/functions --ignore-scripts --prefer-offline --no-audit --no-fund
    - name: Verifier les mails desactives avant la bascule NAP
      # The closed licence scope keeps mail active and reads the official source only.
      run: python tooling/tools/check-production-mail-disabled.py
    - name: Sauvegarder le code PROD avant publication
      id: backup
      if: inputs.resume_run == '0'
      run: python tooling/tools/preflight-production-release.py
    - name: Chiffrer puis tester la sauvegarde
      if: inputs.resume_run == '0'
      run: 'node tooling/tools/production-backup-crypto.js seal "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/prod-backup.enc"

        node tooling/tools/production-backup-crypto.js open "$RUNNER_TEMP/prod-backup.enc" "$RUNNER_TEMP/backup-verification"

        diff -qr "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/backup-verification"'
    - name: Ouvrir la sauvegarde initiale pour une reprise
      if: inputs.resume_run != '0'
      run: 'cp "$PLAN/encrypted/prod-backup.enc" "$RUNNER_TEMP/prod-backup.enc"

        node tooling/tools/production-backup-crypto.js open "$RUNNER_TEMP/prod-backup.enc" "$RUNNER_TEMP/prod-backup"

        python tooling/tools/release-cycle.py verify-resume "$PLAN" "$RUNNER_TEMP/prod-backup"'
      id: resume
    - name: Associer les controles au commit
      run: 'python - <<''PYCODE''

        import json, os

        from pathlib import Path

        p=Path(os.environ[''RUNNER_TEMP''])/''prod-backup/report.json''

        r=json.loads(p.read_text()); r[''commitLabel'']=True; p.write_text(json.dumps(r))

        with open(os.environ[''GITHUB_ENV''],''a'') as out: out.write(''APP_CHECK=''+r[''appCheck'']+''\n'')

        PYCODE'
    - uses: actions/upload-artifact@v4
      with:
        name: release-plan
        path: ${{ runner.temp }}/release-plan/*.json
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: production-code-backup
        path: ${{ runner.temp }}/prod-backup.enc
        if-no-files-found: error
        retention-days: 14
    - name: Preparer les Functions selectionnees
      if: steps.plan.outputs.backend == 'true' && steps.plan.outputs.bcc_preservation != 'true'
      run: 'python tooling/tools/release-cycle.py stage candidate livepalmes "$RUNNER_TEMP/production-functions" "$CANDIDATE_SHA"

        npm ci --prefix "$RUNNER_TEMP/production-functions/functions"'
    - name: Simuler les Functions par petits lots
      if: steps.plan.outputs.backend == 'true' && steps.plan.outputs.bcc_preservation != 'true'
      run: python tooling/tools/release-cycle.py batches livepalmes candidate "$RUNNER_TEMP/production-functions" "$RELEASE_SELECTION"
        dry-run
    - name: Publier les Functions par petits lots
      id: functions
      if: steps.plan.outputs.backend == 'true'
      continue-on-error: true
      run: |
        python tooling/tools/release-cycle.py batches livepalmes candidate "$RUNNER_TEMP/production-functions" "$RELEASE_SELECTION" deploy
        python tooling/tools/publish-approved-pdf-functions.py candidate "$PLAN" "$RELEASE_BACKUP_DIRECTORY"
    - name: Controler toutes les Functions et les exclusions
      id: state
      env:
        DEPLOY_OUTCOME: ${{ steps.functions.outcome == 'failure' && 'failure' || 'success' }}
      if: always() && (steps.functions.outcome == 'success' || steps.functions.outcome == 'failure' || (steps.plan.outputs.backend
        == 'false' && (steps.backup.outcome == 'success' || steps.resume.outcome == 'success')))
      run: python tooling/tools/production-release-state.py check "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/production-after.json"
        "$DEPLOY_OUTCOME"
    - name: Confirmer les mails desactives avant Hosting
      if: steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      run: |
        python tooling/tools/check-production-mail-disabled.py
        python tooling/tools/check-production-nap-runtime.py
    - uses: actions/upload-artifact@v4
      with:
        name: production-after
        path: ${{ runner.temp }}/production-after.json
        if-no-files-found: error
        retention-days: 14
      if: always() && steps.state.outcome != 'skipped'
    - uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
      if: steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
    - name: Publier Hosting apres les controles
      id: hosting
      if: steps.state.outcome == 'success' && steps.functions.outcome != 'failure'
      run: 'node tooling/tools/check-hosting-payload.js candidate

        cd candidate

        tests/firestore-rules/node_modules/.bin/firebase deploy --project livepalmes --only hosting --non-interactive --message
        "LivePalmes $CANDIDATE_SHA run $GITHUB_RUN_ID"'
    - name: Controler les pages publiees
      if: steps.hosting.outcome == 'success'
      env:
        HOSTING_CHECK_RECEIPT: ${{ runner.temp }}/production-hosting-check.json
      run: python tooling/tools/check-production-hosting.py candidate
    - name: Relever Hosting apres la tentative
      if: always() && (steps.hosting.outcome == 'success' || steps.hosting.outcome == 'failure')
      run: python tooling/tools/production-release-state.py hosting-state "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/production-hosting-after.json"
    - uses: actions/upload-artifact@v4
      with:
        name: production-hosting-after
        path: |
          ${{ runner.temp }}/production-hosting-after.json
          ${{ runner.temp }}/production-hosting-check.json
        if-no-files-found: error
        retention-days: 14
      if: always() && (steps.hosting.outcome == 'success' || steps.hosting.outcome == 'failure')
    - uses: google-github-actions/auth@v3
      if: always() && steps.plan.outputs.idf_preservation == 'true' && (steps.state.outcome == 'success' || steps.state.outcome == 'failure')
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - name: Confirmer IDF inchange apres Hosting
      id: idf_after
      if: always() && steps.plan.outputs.idf_preservation == 'true' && (steps.state.outcome == 'success' || steps.state.outcome == 'failure')
      run: python tooling/tools/check-production-mail-disabled.py --after
    - uses: actions/upload-artifact@v4
      if: always() && steps.plan.outputs.idf_preservation == 'true' && (steps.state.outcome == 'success' || steps.state.outcome == 'failure')
      with:
        name: production-idf-preservation
        path: |
          ${{ runner.temp }}/release-plan/public-reader-idf-*.json
          ${{ runner.temp }}/release-plan/notification-scheduler-before.json
          ${{ runner.temp }}/release-plan/license-report-*.json
        if-no-files-found: error
        retention-days: 14
    - uses: google-github-actions/auth@v3
      if: always() && steps.plan.outputs.bcc_preservation == 'true' && (steps.state.outcome == 'success' || steps.state.outcome == 'failure')
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - name: Confirmer la coupure CCI et les ressources inchangees
      id: bcc_after
      if: always() && steps.plan.outputs.bcc_preservation == 'true' && (steps.state.outcome == 'success' || steps.state.outcome == 'failure')
      run: python tooling/tools/check-production-bcc.py after "$PLAN"
    - uses: actions/upload-artifact@v4
      if: always() && steps.plan.outputs.bcc_preservation == 'true' && (steps.state.outcome == 'success' || steps.state.outcome == 'failure')
      with:
        name: production-bcc-guards
        path: ${{ runner.temp }}/release-plan/bcc-*-witness.json
        if-no-files-found: error
        retention-days: 14
    - name: Conclure
      env:
        STATE: ${{ steps.state.outcome }}
        HOSTING: ${{ steps.hosting.outcome }}
        IDF_PRESERVATION: ${{ steps.plan.outputs.idf_preservation }}
        IDF_AFTER: ${{ steps.idf_after.outcome }}
        BCC_PRESERVATION: ${{ steps.plan.outputs.bcc_preservation }}
        BCC_AFTER: ${{ steps.bcc_after.outcome }}
      if: always()
      run: 'test "$STATE" = success

        test "$HOSTING" = success

        if [ "$IDF_PRESERVATION" = true ]; then test "$IDF_AFTER" = success; fi

         if [ "$BCC_PRESERVATION" = true ]; then test "$BCC_AFTER" = success; fi

        echo "Publication du commit $CANDIDATE_SHA terminee, code uniquement." >> "$GITHUB_STEP_SUMMARY"'
