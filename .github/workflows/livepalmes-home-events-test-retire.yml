name: Retirer le seul ancien job rendez-vous TEST
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
        type: string
permissions:
  contents: read
jobs:
  pause:
    if: github.ref == 'refs/heads/main' && (inputs.confirmation == 'pause-livepalmes-test-home-events' || inputs.confirmation == 'delete-livepalmes-test-home-events')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - run: node tools/pause-home-events-test.js
        env:
          TARGET_FIREBASE_PROJECT: livepalmes-test
          LIVEPALMES_HOME_DATA_CONFIRMATION: ${{ inputs.confirmation }}
      - uses: actions/upload-artifact@v4
        with:
          name: home-events-retire-proof
          path: outputs/home-events-*-proof.json
          if-no-files-found: error
