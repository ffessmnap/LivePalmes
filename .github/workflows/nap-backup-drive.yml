name: Sauvegarde NAP vers Drive
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: check
        required: true
        options: [check, trial, backup]
      confirmation:
        description: Confirmation explicite requise pour l essai ou la sauvegarde
        type: string
        required: false
  schedule:
    - cron: '0 0 * * 2'
      timezone: Europe/Paris
permissions:
  contents: read
concurrency:
  group: nap-database-backup
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.NAP_BACKUP_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nap-backup
    env:
      BACKUP_MODE: ${{ github.event_name == 'schedule' && 'backup' || inputs.mode }}
      NAP_BACKUP_CONFIRMATION: ${{ github.event_name == 'schedule' && 'NAP-PROD-SAUVEGARDE-ET-VERROUILLAGE-AUTORISES' || inputs.confirmation }}
      NAP_BACKUP_FOLDER_ID: ${{ vars.NAP_BACKUP_FOLDER_ID }}
      NAP_BACKUP_SCHEDULE_ENABLED: ${{ vars.NAP_BACKUP_SCHEDULE_ENABLED }}
      NAP_BACKUP_RESTORE_PROOF: ${{ vars.NAP_BACKUP_RESTORE_PROOF }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verifier les garde-fous avant les secrets et les acces reseau
        run: |
          node -e 'const b=require("./tools/nap-backup"); if(["backup","trial"].includes(process.env.BACKUP_MODE)) b.backupGate(require("./tools/nap-backup-config.json"),process.env,process.env.BACKUP_MODE); else if(process.env.BACKUP_MODE!=="check") process.exit(1);'
      - name: Installer les dependances existantes
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.NAP_BACKUP_SERVICE_ACCOUNT_JSON }}
          project_id: livepalmes-test
      - name: Verifier sauvegarder ou essayer la recuperation isolee
        env:
          NAP_BACKUP_ENCRYPTION_KEY: ${{ secrets.NAP_BACKUP_ENCRYPTION_KEY }}
        run: node tools/nap-backup.js "--$BACKUP_MODE"
      - name: Conserver la copie chiffree meme si Drive ou la restauration echoue
        if: always() && (env.BACKUP_MODE == 'backup' || env.BACKUP_MODE == 'trial')
        uses: actions/upload-artifact@v4
        with:
          name: nap-backup-encrypted-${{ github.run_id }}
          path: outputs/nap-backups/*.sql.gz.enc
          if-no-files-found: ignore
          retention-days: 14
      - name: Conserver le recu technique sans donnees metier ni secret
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nap-backup-report
          path: outputs/nap-backups/report.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Bilan
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          echo "Mode : $BACKUP_MODE. Etat : $RUN_STATUS. Horaire prevu : mardi 00 h Europe/Paris." >> "$GITHUB_STEP_SUMMARY"
          echo "Essai : recuperation du fichier Drive et restauration dans un MySQL jetable sans reseau. Aucune restauration vers NAP." >> "$GITHUB_STEP_SUMMARY"
          echo "Activation automatique conditionnee a la preuve de restauration. Aucune suppression Drive automatique." >> "$GITHUB_STEP_SUMMARY"
