name: Controler les prerequis PROD sans ecriture
'on':
  workflow_dispatch:
    inputs:
      preparation_run:
        description: Run du plan a verifier avant accord final, aucune publication
        required: true
        type: string
      identity_only:
        description: Identifiant public du credential Hosting existant, sans authentification Google ni appel Cloud
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
env:
  npm_config_fetch_retries: '2'
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retry_mintimeout: '1000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  prerequisites:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.identity_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: backend
            secret: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND
          - kind: hosting
            secret: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets[matrix.secret] }}
          project_id: livepalmes
      - uses: google-github-actions/setup-gcloud@v3
      - name: Identifier le lecteur licences du plan authentifie
        id: scope
        if: matrix.kind == 'backend'
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/prerequisites" "$PLAN_RUN" prepare
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        if: steps.scope.outputs.license_reports == 'true'
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Installer le lecteur borne des bilans licences
        if: steps.scope.outputs.license_reports == 'true'
        run: npm ci --prefix functions --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Lire les permissions, quotas et la derive du plan
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
          KIND: ${{ matrix.kind }}
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/prerequisites" "$PLAN_RUN" "$KIND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-prerequisites-${{ matrix.kind }}
          path: ${{ runner.temp }}/prerequisites/prerequisites-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Distinguer installations et tests
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "tools/ci-runtime.py" ]; then
            python "tools/ci-runtime.py" timings
          else
            echo "Mesure indisponible pour ce candidat historique ; controles inchanges." >> "$GITHUB_STEP_SUMMARY"
          fi

  hosting_identity:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.identity_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Authentifier le plan et la CI du seul diagnostic
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/hosting-identity" "$PLAN_RUN" identity-prepare
      - name: Extraire le seul identifiant public du credential existant
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
          PRODUCTION_HOSTING_CREDENTIAL_METADATA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/hosting-identity" "$PLAN_RUN" identity
      - uses: actions/upload-artifact@v4
        with:
          name: production-hosting-identity
          path: ${{ runner.temp }}/hosting-identity/production-hosting-identity*.json
          if-no-files-found: error
          retention-days: 14
