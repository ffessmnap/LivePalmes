name: Controler les prerequis PROD sans ecriture
'on':
  workflow_dispatch:
    inputs:
      session_enforcement_completion:
        description: Complement ferme du seul run44099971258, sources deja attestees, aucune nouvelle source
        required: false
        type: boolean
        default: false
      preparation_run:
        description: Run du plan a verifier avant accord final, aucune publication
        required: true
        type: string
      recovery_run:
        description: Cloture Hosting A3.3 qualifiee du seul run 43980814596, sinon 0
        required: false
        type: string
        default: '0'
      identity_only:
        description: Identifiant public du credential Hosting existant, sans authentification Google ni appel Cloud
        required: true
        type: boolean
        default: false
      rules_observation_only:
        description: Observer la base Rules reelle sans valider le contrat ni publier
        required: true
        type: boolean
        default: false
      discovery_json:
        description: Decouverte avant contrat, JSON candidat exact et services hosting/sources/rules ; preparation_run=0, aucun droit ni publication
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
env:
  npm_config_fetch_retries: '2'
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retry_mintimeout: '1000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  prerequisites:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.session_enforcement_completion && !inputs.identity_only && !inputs.rules_observation_only && inputs.discovery_json == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: backend
            secret: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND
          - kind: hosting
            secret: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      A33_RECOVERY_RUN: ${{ inputs.recovery_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets[matrix.secret] }}
          project_id: livepalmes
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Identifier le lecteur licences du plan authentifie
        id: scope
        if: matrix.kind == 'backend'
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/prerequisites" "$PLAN_RUN" prepare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        if: steps.scope.outputs.license_reports == 'true' || steps.scope.outputs.access_revocation_reader == 'true'
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Installer le lecteur borne des bilans licences
        if: steps.scope.outputs.license_reports == 'true'
        run: npm ci --prefix functions --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Qualifier la sauvegarde et les revisions initiales A3.3
        if: steps.scope.outputs.access_revocation_reader == 'true' && inputs.recovery_run != '0'
        run: python tools/access-revocation-production-recovery.py qualify "$RUNNER_TEMP/prerequisites"
      - name: Utiliser le lecteur Auth existant A3.3
        if: steps.scope.outputs.access_revocation_reader == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
          project_id: livepalmes
      - name: Qualifier la continuite administrative A3.3
        if: steps.scope.outputs.access_revocation_reader == 'true'
        run: python tools/access-revocation-production-policy.py "$RUNNER_TEMP/prerequisites" auth-before
      - name: Restaurer le compte backend existant A3.3
        if: always() && steps.scope.outputs.access_revocation_reader == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
          project_id: livepalmes
      - name: Lire les permissions, quotas et la derive du plan
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
          KIND: ${{ matrix.kind }}
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/prerequisites" "$PLAN_RUN" "$KIND"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-prerequisites-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/prerequisites/prerequisites-*.json
            ${{ runner.temp }}/prerequisites/standard-access-revocation-*.json
            ${{ runner.temp }}/prerequisites/http_headers-*.json
            ${{ runner.temp }}/prerequisites/direct_csp-*.json
            ${{ runner.temp }}/prerequisites/standard-session-prepare-*.json
            ${{ runner.temp }}/prerequisites/standard-session-enforcement-*.json
            ${{ runner.temp }}/prerequisites/production-rules-observed.*
          if-no-files-found: warn
          retention-days: 14

      - name: Distinguer installations et tests
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "tools/ci-runtime.py" ]; then
            python "tools/ci-runtime.py" timings
          else
            echo "Mesure indisponible pour ce candidat historique ; controles inchanges." >> "$GITHUB_STEP_SUMMARY"
          fi


  discovery:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.session_enforcement_completion && inputs.discovery_json != '' && !inputs.identity_only && !inputs.rules_observation_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: backend
            secret: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND
          - kind: hosting
            secret: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRODUCTION_DISCOVERY_JSON: ${{ inputs.discovery_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets[matrix.secret] }}
          project_id: livepalmes
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Observer identite permissions et cible avant contrat
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/discovery" 0 "discover-${{ matrix.kind }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-discovery-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/discovery/production-discovery-*.json
            ${{ runner.temp }}/discovery/discovered-production.rules
          if-no-files-found: warn
          retention-days: 14

  hosting_identity:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.session_enforcement_completion && inputs.identity_only && !inputs.rules_observation_only && inputs.discovery_json == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Authentifier le plan et la CI du seul diagnostic
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/hosting-identity" "$PLAN_RUN" identity-prepare
      - name: Extraire le seul identifiant public du credential existant
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
          PRODUCTION_HOSTING_CREDENTIAL_METADATA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/hosting-identity" "$PLAN_RUN" identity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-hosting-identity
          path: ${{ runner.temp }}/hosting-identity/production-hosting-identity*.json
          if-no-files-found: error
          retention-days: 14

  rules_observation:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.session_enforcement_completion && inputs.rules_observation_only && !inputs.identity_only && inputs.discovery_json == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
          project_id: livepalmes
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Capturer la seule base Rules reelle sans lever le blocage
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
        run: python tools/check-release-prerequisites.py "$RUNNER_TEMP/rules-observation" "$PLAN_RUN" rules-observe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-rules-observation
          path: |
            ${{ runner.temp }}/rules-observation/production-rules-observation.json
            ${{ runner.temp }}/rules-observation/*.rules
          if-no-files-found: error
          retention-days: 14

  session-enforcement-completion:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.session_enforcement_completion && !inputs.identity_only && !inputs.rules_observation_only && inputs.discovery_json == '' && inputs.recovery_run == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: backend
            secret: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND
          - kind: hosting
            secret: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authentifier le nouveau preflight de cloture
        env:
          PLAN_RUN: ${{ inputs.preparation_run }}
        run: python tools/portal-session-enforcement-completion.py fetch-plan "$RUNNER_TEMP/completion-plan" "$PLAN_RUN"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets[matrix.secret] }}
          project_id: livepalmes
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        if: matrix.kind == 'backend'
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Authentifier la sauvegarde chiffree initiale
        if: matrix.kind == 'backend'
        run: python tools/portal-session-enforcement-completion.py backup-download "$RUNNER_TEMP/completion-plan" "$RUNNER_TEMP/initial-encrypted"
      - name: Ouvrir la sauvegarde initiale sur le seul runner officiel
        id: opened
        if: matrix.kind == 'backend'
        run: node tools/production-backup-crypto.js open "$RUNNER_TEMP/initial-encrypted/prod-backup.enc" "$RUNNER_TEMP/prod-backup"
      - name: Verifier les seules capacites et references de cloture
        env:
          KIND: ${{ matrix.kind }}
          COMPLETION_BACKUP_OPENED: ${{ steps.opened.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ "$KIND" = backend ]; then
            python tools/portal-session-enforcement-completion.py readiness "$RUNNER_TEMP/completion-plan" backend "$RUNNER_TEMP/prod-backup"
          else
            python tools/portal-session-enforcement-completion.py readiness "$RUNNER_TEMP/completion-plan" hosting
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-prerequisites-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/completion-plan/prerequisites-*.json
            ${{ runner.temp }}/completion-plan/completion-observed-*.json
            ${{ runner.temp }}/completion-plan/standard-session-enforcement-auth-prerequisites.json
            ${{ runner.temp }}/completion-plan/standard-session-enforcement-rules-observed.json
          if-no-files-found: warn
          retention-days: 14
      - name: Distinguer installations et tests
        if: always()
        timeout-minutes: 1
        run: python tools/ci-runtime.py timings
