name: Attester les sources protegees equipes sur TEST
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Saisir livepalmes-test pour les seules sources existantes du candidat equipes
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
jobs:
  sources:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirmation == 'livepalmes-test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: firebase-test
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_FIREBASE_PROJECT: livepalmes-test
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: candidate
          ref: 7a6eedb6ee8b6c5943c194e88611219602782fdf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix tooling/tests/firestore-rules --ignore-scripts --prefer-offline --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - name: Controler et actualiser uniquement les sources TEST
        run: python tooling/tools/team-closure-test-sources.py candidate "$RUNNER_TEMP/team-closure-sources"
      - uses: actions/upload-artifact@v4
        with:
          name: test-backend-proof
          path: ${{ runner.temp }}/team-closure-sources/test-backend-proof.json
          if-no-files-found: error
          retention-days: 14
