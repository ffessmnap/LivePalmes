name: Controle des originaux documentaires NAP
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-legacy-document-check
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nap-backup
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
      - name: Installer les dependances existantes sans script
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.NAP_BACKUP_SERVICE_ACCOUNT_JSON }}
          project_id: livepalmes-test
      - name: Verifier six anciens liens depuis le serveur de sauvegarde
        run: node tools/a2-nap-documents.js
      - uses: actions/upload-artifact@v4
        with:
          name: a2-legacy-check
          path: outputs/a2-legacy-check/report.json
          if-no-files-found: error
          retention-days: 90