name: Controle des originaux documentaires NAP
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2-legacy-document-check
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nap-backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
      - name: Installer les dependances existantes sans script
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.NAP_BACKUP_SERVICE_ACCOUNT_JSON }}
          project_id: livepalmes-test
      - name: Verifier six anciens liens depuis le serveur de sauvegarde
        run: node tools/a2-nap-documents.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a2-legacy-check
          path: outputs/a2-legacy-check/report.json
          if-no-files-found: error
          retention-days: 90