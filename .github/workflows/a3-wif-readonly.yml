name: Qualifier WIF en lecture seule avant tout changement de publication
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Main exact valide CI ; configuration IAM specifique deja autorisee
        type: string
        required: true
      qualification:
        description: Controle ferme sans changement de publication
        type: choice
        default: auth-renewal
        options:
          - auth-renewal
          - hosting-consumers
          - hosting-renewal
permissions:
  contents: read
  actions: read
concurrency:
  group: a3-wif-readonly
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.expected_commit == github.sha
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      GOOGLE_CLOUD_PROJECT: livepalmes
      GCLOUD_PROJECT: livepalmes
      WIF_QUALIFICATION: ${{ inputs.qualification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Authentifier la CI main exacte avant toute federation
        id: ci
        run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/a3-wif-ci"
      - name: Refuser une preuve CI absente ou incompatible
        env:
          VERIFIED: ${{ steps.ci.outputs.verified }}
        run: test "$VERIFIED" = true
      - name: Refuser tout autre controle avant federation
        run: test "$WIF_QUALIFICATION" = auth-renewal || test "$WIF_QUALIFICATION" = hosting-consumers || test "$WIF_QUALIFICATION" = hosting-renewal
      - name: Installer uniquement le SDK deja verrouille
        if: inputs.qualification == 'auth-renewal'
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Installer le CLI Firebase deja verrouille
        if: inputs.qualification == 'hosting-consumers' || inputs.qualification == 'hosting-renewal'
        run: npm ci --prefix tests/firestore-rules --ignore-scripts --no-audit --no-fund
      - name: Identite ephemere du seul lecteur Hosting existant
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: livepalmes
          workload_identity_provider: projects/718081132564/locations/global/workloadIdentityPools/livepalmes-github/providers/github-a3-production
          audience: https://iam.googleapis.com/projects/718081132564/locations/global/workloadIdentityPools/livepalmes-github/providers/github-a3-production
          service_account: github-actions-livepalmes@livepalmes.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: inputs.qualification == 'hosting-consumers'
        with:
          version: '593.0.0'
      - name: Lire les seules metadonnees Hosting avec Python et Firebase CLI
        if: inputs.qualification == 'hosting-consumers'
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: python tools/a3-wif-hosting-readonly.py "$RUNNER_TEMP/a3-wif-hosting-proof"
      - name: Verifier les deux lectures CLI apres expiration reelle de reference
        if: inputs.qualification == 'hosting-renewal'
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: python tools/a3-wif-hosting-renewal.py "$RUNNER_TEMP/a3-wif-hosting-renewal-proof"
      - name: Lire la configuration puis attendre le vrai renouvellement SDK
        if: inputs.qualification == 'auth-renewal'
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: node tools/a3-wif-readonly.js "$RUNNER_TEMP/a3-wif-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.qualification == 'auth-renewal'
        with:
          name: a3-wif-readonly-proof
          path: ${{ runner.temp }}/a3-wif-proof/wif-readonly-proof.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.qualification == 'hosting-consumers'
        with:
          name: a3-wif-hosting-proof
          path: ${{ runner.temp }}/a3-wif-hosting-proof/wif-hosting-proof.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.qualification == 'hosting-renewal'
        with:
          name: a3-wif-hosting-renewal-proof
          path: ${{ runner.temp }}/a3-wif-hosting-renewal-proof/wif-hosting-renewal-proof.json
          if-no-files-found: error
          retention-days: 14
