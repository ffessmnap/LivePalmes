name: Ajouter le complement personnes NAP autorise
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      confirmation:
        description: nap-create-club-people-options ou nap-add-official-identity-fields, apres accord specifique
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nap-authorized-people-schema
  cancel-in-progress: false
jobs:
  create:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
      NAP_PEOPLE_SCHEMA_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7
        with:
          persist-credentials: false
      - name: Verifier le commit et la confirmation
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          case "$NAP_PEOPLE_SCHEMA_CONFIRMATION" in nap-create-club-people-options|nap-add-official-identity-fields) ;; *) exit 1 ;; esac
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # version: v7
        with:
          node-version: '22'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # version: v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # version: v3
      - name: Sauvegarder le plan et la structure avant creation
        env:
          NAP_PEOPLE_SCHEMA_PHASE: prepare
        run: node tools/add-nap-people-options.js
      - name: Conserver la sauvegarde avant toute creation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # version: v4
        with:
          name: nap-people-schema-before
          path: outputs/nap-people-schema-before.json
          if-no-files-found: error
          retention-days: 90
      - name: Creer uniquement le complement absent puis verifier
        env:
          NAP_PEOPLE_SCHEMA_PHASE: apply
        run: node tools/add-nap-people-options.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # version: v4
        if: always()
        with:
          name: nap-people-schema-result
          path: outputs/nap-people-schema-*.json
          if-no-files-found: ignore
          retention-days: 90
