name: Verifier la structure et les contrats NAP publics
on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        default: source-inventory
        type: choice
        options: [source-inventory, calendar-contract, portal-contract, engagement-contract, portal-competition-contract, portal-entry-contract, portal-competition-write-plans, portal-course-document-contract]
      expected_commit:
        required: true
        type: string
      confirmation:
        description: Saisir livepalmes-test-nap-structure-readonly
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-test
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
      NAP_SOURCE_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verifier la cible
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$CONFIRMATION" = livepalmes-test-nap-structure-readonly
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - run: node tools/inspect-nap-source-inventory.js
      - uses: actions/upload-artifact@v4
        with:
          name: nap-source-inventory
          path: outputs/nap-*.json
          if-no-files-found: error
          retention-days: 14
