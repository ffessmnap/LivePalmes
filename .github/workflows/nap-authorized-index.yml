name: Ajouter un index NAP explicitement autorise
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      index:
        required: true
        type: choice
        options: [search, top, competition, calendar, homeEndDate, documents, documentThemes, roster]
      confirmation:
        description: nap-add-INDEX-index, apres accord specifique pour cet index
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nap-authorized-index
  cancel-in-progress: false
jobs:
  add:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
      NAP_AUTHORIZED_INDEX: ${{ inputs.index }}
      NAP_INDEX_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7
        with:
          persist-credentials: false
      - name: Verifier le commit et la confirmation
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$NAP_INDEX_CONFIRMATION" = "nap-add-$NAP_AUTHORIZED_INDEX-index"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # version: v7
        with:
          node-version: '22'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # version: v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # version: v3
      - run: node tools/add-nap-direct-index.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # version: v4
        if: always()
        with:
          name: nap-index-schema-proof
          path: outputs/nap-*.json
          if-no-files-found: ignore
          retention-days: 30
