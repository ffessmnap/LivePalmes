name: Mesurer les lectures rendez-vous NAP sans écriture
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
        type: string
      direct:
        description: Mesurer les requêtes complètes du nouveau lecteur après index
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  measure:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'livepalmes-test-home-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # version: v7
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # version: v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # version: v3
      - run: node tools/measure-home-nap.js
        env:
          TARGET_FIREBASE_PROJECT: livepalmes-test
          HOME_NAP_DIRECT: ${{ inputs.direct }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # version: v4
        with:
          name: home-nap-measurement
          path: outputs/home-nap-measurement.json
          if-no-files-found: error
