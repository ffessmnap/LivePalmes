name: Mesurer les lectures rendez-vous NAP sans écriture
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
        type: string
permissions:
  contents: read
jobs:
  measure:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'livepalmes-test-home-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - run: node tools/measure-home-nap.js
        env:
          TARGET_FIREBASE_PROJECT: livepalmes-test
      - uses: actions/upload-artifact@v4
        with:
          name: home-nap-measurement
          path: outputs/home-nap-measurement.json
          if-no-files-found: error
