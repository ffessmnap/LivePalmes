name: Reprise reconstruction Firebase TEST

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Saisir exactement resume-livepalmes-test-postsync
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: livepalmes-test-postsync
  cancel-in-progress: false

env:
  TARGET_FIREBASE_PROJECT: livepalmes-test
  GCLOUD_PROJECT: livepalmes-test
  GOOGLE_CLOUD_PROJECT: livepalmes-test
  LIVEPALMES_POSTSYNC_REMOTE_RESUME: 'true'
  LIVEPALMES_POSTSYNC_SKIP_INITIAL_PHASES: 'true'

jobs:
  reprendre-postsync-test:
    name: Reprendre index, TOP, DTN et publications TEST
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 720
    environment:
      name: firebase-test
      deployment: false
    steps:
      - name: Vérifier la confirmation et la cible TEST
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "resume-livepalmes-test-postsync"
          test "$TARGET_FIREBASE_PROJECT" = "livepalmes-test"
          test "$GCLOUD_PROJECT" = "livepalmes-test"
          test "$GOOGLE_CLOUD_PROJECT" = "livepalmes-test"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Récupérer la version post-sync validée
        uses: actions/checkout@v7
        with:
          ref: 2d75ebf10cb65f1e2a46a175da756720e3168b3f
          persist-credentials: false

      - name: Contrôler la version exécutée
        shell: bash
        run: test "$(git rev-parse HEAD)" = "2d75ebf10cb65f1e2a46a175da756720e3168b3f"

      - name: Lire la version Node.js du projet
        id: node-version
        shell: bash
        run: node -p '"version=" + require("./functions/package.json").engines.node' >> "$GITHUB_OUTPUT"

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer les dépendances Functions
        run: npm ci --prefix functions

      - name: Vérifier le runner avant exécution
        run: |
          node --check tools/firebase-test-postsync-runner.js
          node tests/firebase-test-full-sync-runner-tests.js

      - name: Préparer et verrouiller les credentials TEST
        shell: bash
        env:
          FIREBASE_TEST_BACKEND_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_TEST_BACKEND_CREDENTIALS"
          umask 077
          credentials_file="$RUNNER_TEMP/livepalmes-test-postsync.json"
          printf '%s' "$FIREBASE_TEST_BACKEND_CREDENTIALS" > "$credentials_file"
          node - "$credentials_file" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const credentials = JSON.parse(fs.readFileSync(file, "utf8"));
          if (credentials.project_id !== "livepalmes-test") {
            throw new Error("Le compte de service post-sync n'appartient pas à livepalmes-test.");
          }
          NODE
          echo "LIVEPALMES_TEST_SYNC_CREDENTIAL=$credentials_file" >> "$GITHUB_ENV"
          echo "LIVEPALMES_TEST_POSTSYNC_STATE=$RUNNER_TEMP/livepalmes-postsync-state.json" >> "$GITHUB_ENV"

      - name: Reprendre la reconstruction depuis Firestore TEST
        shell: bash
        run: |
          set -euo pipefail
          node tools/firebase-test-postsync-runner.js

      - name: Afficher l'état final du runner
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/livepalmes-postsync-state.json" ]; then
            node - <<'NODE'
            const fs = require("node:fs");
            const path = process.env.RUNNER_TEMP + "/livepalmes-postsync-state.json";
            const state = JSON.parse(fs.readFileSync(path, "utf8"));
            console.log(JSON.stringify({
              swimmerIndex: state.swimmerIndex || null,
              topIndex: state.topIndex || null,
              dtnDone: state.dtnDone === true,
              publicationsDone: state.publicationsDone === true,
              allDone: state.allDone === true
            }, null, 2));
            NODE
          fi

      - name: Supprimer les credentials temporaires
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/livepalmes-test-postsync.json" "$RUNNER_TEMP/livepalmes-postsync-state.json"
