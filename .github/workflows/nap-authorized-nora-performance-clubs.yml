name: Restaurer les clubs historiques de Nora explicitement autorises
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      confirmation:
        description: nap-nora-13787-performance-clubs-20261024, accord specifique Antoine
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nap-authorized-nora-performance-clubs
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-test
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
      NORA_CLUBS_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verifier le commit et le perimetre fixe autorise
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$NORA_CLUBS_CONFIRMATION" = "nap-nora-13787-performance-clubs-20261024"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - name: Preparer le plan depuis les audits et sauvegarder sans ecriture sportive
        run: node tools/repair-nora-performance-clubs.js
        env:
          NORA_CLUBS_PHASE: prepare
      - uses: actions/upload-artifact@v4
        with:
          name: nora-performance-clubs-before
          path: outputs/nora-performance-clubs-before.json
          if-no-files-found: error
          retention-days: 90
      - name: Appliquer uniquement les clubs certains et verifier
        run: node tools/repair-nora-performance-clubs.js
        env:
          NORA_CLUBS_PHASE: apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nora-performance-clubs-proof
          path: outputs/nora-performance-clubs-result.json
          if-no-files-found: ignore
          retention-days: 90
