name: Qualifier les capacites existantes A5
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Commit main exact ayant reussi la CI
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: a5-existing-capabilities
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.expected_commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: livepalmes
            reader: backend
            environment: production
            credential: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND
          - project: livepalmes
            reader: hosting
            environment: production
            credential: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES
          - project: livepalmes-test
            reader: backend
            environment: firebase-test
            credential: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND
          - project: livepalmes-test
            reader: hosting
            environment: firebase-test
            credential: FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST
    environment: ${{ matrix.environment }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authentifier la CI main avant les identites
        id: ci
        run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/a5-capabilities-ci"
      - name: Refuser une preuve absente
        env:
          VERIFIED: ${{ steps.ci.outputs.verified }}
        run: test "$VERIFIED" = true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets[matrix.credential] }}
          project_id: ${{ matrix.project }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Lire les seules permissions deja presentes
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: python tools/a5-legacy-direct-capabilities.py "${{ matrix.project }}" "${{ matrix.reader }}" "$RUNNER_TEMP/a5-capabilities.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: a5-capabilities-${{ matrix.project }}-${{ matrix.reader }}
          path: ${{ runner.temp }}/a5-capabilities.json
          if-no-files-found: error
          retention-days: 7
