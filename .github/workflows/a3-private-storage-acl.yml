name: Qualifier les ACL privees A3 avec le lecteur Hosting existant
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Main exact valide CI ; ACL agregees sans contenu ni ajout de droit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: a3-private-storage-acl
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.expected_commit == github.sha
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Authentifier la CI publication du main exact
        id: ci
        run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/a3-private-acl-ci"
      - name: Exiger la preuve avant toute identite Google
        run: test '${{ steps.ci.outputs.verified }}' = true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
          project_id: livepalmes
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Qualifier les permissions et ACL sans jeton documentaire ni contenu
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: python tools/a3-private-storage-acl.py "$RUNNER_TEMP/a3-private-storage-acl.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: a3-private-storage-acl
          path: ${{ runner.temp }}/a3-private-storage-acl.json
          if-no-files-found: warn
          retention-days: 14
      - name: Distinguer installations et tests
        if: always()
        timeout-minutes: 1
        run: python tools/ci-runtime.py timings
