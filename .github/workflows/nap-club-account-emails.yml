name: Reprendre les comptes PROD dans l'annuaire NAP partage
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Commit main exact controle
        required: true
        type: string
      mode:
        type: choice
        required: true
        default: inspect
        options: [inspect, apply]
      confirmation:
        description: Pour apply uniquement, nap-shared-prod-account-emails apres accord specifique
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      ACCOUNT_EMAILS_MODE: ${{ inputs.mode }}
      ACCOUNT_EMAILS_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verifier le candidat et les tests hors reseau
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          node tests/nap-club-account-emails-tests.js
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix functions --ignore-scripts
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
          project_id: livepalmes
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inventorier ou reprendre uniquement les profils PROD sans envoi
        run: node tools/rebuild-nap-club-account-emails.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nap-club-account-emails-receipt
          path: outputs/nap-club-account-emails-*.json
          if-no-files-found: ignore
          retention-days: 90
