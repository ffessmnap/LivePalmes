name: Reprendre les comptes PROD dans l'annuaire NAP partage
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Commit main exact controle
        required: true
        type: string
      mode:
        type: choice
        required: true
        default: inspect
        options: [inspect, apply]
      confirmation:
        description: Pour apply uniquement, nap-shared-prod-account-emails apres accord specifique
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firebase-test
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      ACCOUNT_EMAILS_MODE: ${{ inputs.mode }}
      ACCOUNT_EMAILS_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix functions --ignore-scripts
      - name: Verifier le candidat et les tests hors reseau
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          gh run list --workflow livepalmes-verification-preview.yml --commit "$GITHUB_SHA" --event push --status success --limit 10 --json headSha,conclusion --jq '.[] | select(.conclusion == "success") | .headSha' | grep -Fx "$GITHUB_SHA"
          node tests/nap-club-account-emails-tests.js
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspecter NAP via la maintenance privee existante sans ecriture
        env:
          ACCOUNT_EMAILS_PHASE: inspect
        run: node tools/rebuild-nap-club-account-emails.js
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
          project_id: livepalmes
      - name: Lire uniquement les profils PROD et verifier leur sauvegarde chiffree
        env:
          ACCOUNT_EMAILS_PHASE: export
        run: node tools/rebuild-nap-club-account-emails.js
      - uses: google-github-actions/auth@v3
        if: inputs.mode == 'apply'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - name: Sauvegarder la projection existante sans ecriture
        if: inputs.mode == 'apply'
        env:
          ACCOUNT_EMAILS_PHASE: prepare
        run: node tools/rebuild-nap-club-account-emails.js
      - uses: actions/upload-artifact@v4
        with:
          name: nap-club-account-emails-before
          path: outputs/nap-club-account-emails/*.enc
          if-no-files-found: error
          retention-days: 90
      - name: Creer et reprendre la projection PROD par pages sans envoi
        if: inputs.mode == 'apply'
        env:
          ACCOUNT_EMAILS_PHASE: apply
        run: node tools/rebuild-nap-club-account-emails.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nap-club-account-emails-receipt
          path: outputs/nap-club-account-emails/*-receipt.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Effacer les seuls fichiers locaux non chiffres
        if: always()
        run: node -e 'const fs=require("fs");for(const name of ["source.json","target.json","before.json"])fs.rmSync("outputs/nap-club-account-emails/"+name,{force:true})'
