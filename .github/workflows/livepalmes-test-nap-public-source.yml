name: Preparer la source publique NAP sur TEST
run-name: Audit source NAP TEST sans publication
'on':
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Commit main exact a verifier
        required: true
        type: string
      confirmation:
        description: Saisir livepalmes-test-nap-readonly
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firebase-test
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verifier la cible et le commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = livepalmes-test-nap-readonly
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - name: Verifier l'export et la construction hors reseau
        run: |
          node tests/nap-public-export-tests.js
          node tests/nap-public-pipeline-tests.js
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - name: Exporter les champs publics NAP avec deux lectures identiques
        run: node tools/export-nap-public-source.js outputs/nap-public-source
      - name: Construire et verifier les fichiers des pages existantes
        run: node tools/build-nap-public-files.js outputs/nap-public-source outputs/nap-public-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: nap-public-source-proof
          path: |
            outputs/nap-public-source/export-proof.json
            outputs/nap-public-candidate/public/manifest.json
          if-no-files-found: error
          retention-days: 14
