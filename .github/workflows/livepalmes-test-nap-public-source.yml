name: Preparer la source publique NAP sur TEST
run-name: Audit source NAP TEST sans publication
'on':
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Commit main exact a verifier
        required: true
        type: string
      confirmation:
        description: Saisir livepalmes-test-nap-readonly
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firebase-test
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verifier la cible et le commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = livepalmes-test-nap-readonly
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - name: Verifier l'export et la construction hors reseau
        run: |
          node tests/nap-public-export-tests.js
          node tests/nap-public-pipeline-tests.js
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Exporter les champs publics NAP avec deux lectures identiques
        run: node tools/export-nap-public-source.js outputs/nap-public-source
      - name: Construire et verifier les fichiers des pages existantes
        run: node tools/build-nap-public-files.js outputs/nap-public-source outputs/nap-public-candidate
      - name: Capturer la publication TEST actuelle en lecture seule
        run: node tools/capture-test-public-performance-reference.js outputs/nap-transition-reference
      - name: Comparer les historiques et les liens avant toute bascule
        run: node tools/audit-nap-public-transition.js outputs/nap-transition-reference outputs/nap-public-candidate/public outputs/nap-transition-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nap-public-source-proof
          path: |
            outputs/nap-public-source/export-proof.json
            outputs/nap-public-candidate/public/manifest.json
            outputs/nap-transition-report.json
            outputs/nap-transition-reference/reference-proof.json
          if-no-files-found: error
          retention-days: 14
