name: Retour arriere code PROD
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-production
  cancel-in-progress: false
env:
  npm_config_fetch_retries: '2'
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retry_mintimeout: '1000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  verify_controller:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirmation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Authentifier la preuve CI du controleur avant les droits Google
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/ci-publication"
      - name: Exiger la preuve compatible
        env:
          VERIFIED: ${{ steps.ci.outputs.verified }}
        run: test "$VERIFIED" = true

  rollback:
    needs: verify_controller
    if: github.ref == 'refs/heads/main' && inputs.confirmation && github.run_attempt == 1
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      CONFIRM_CODE_ROLLBACK: livepalmes
      RELEASE_RUN: ${{ inputs.release_run }}
      B_RESTORE_HOSTING: ${{ inputs.restore_hosting }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verifier le run source
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_RUN: ${{ inputs.release_run }}
      run: |
        [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > "$RUNNER_TEMP/release-run.json"
        jq -e '(.path == ".github/workflows/livepalmes-production-release.yml" or .path == ".github/workflows/livepalmes-production-resume.yml") and .status == "completed" and .head_branch == "main"' "$RUNNER_TEMP/release-run.json"
    - name: Recuperer et verifier production-code-backup
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_RUN: ${{ inputs.release_run }}
      run: python tools/release-cycle.py artifact "$RELEASE_RUN" production-code-backup "$RUNNER_TEMP/encrypted"
    - name: Recuperer et verifier production-after
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_RUN: ${{ inputs.release_run }}
      run: python tools/release-cycle.py artifact "$RELEASE_RUN" production-after "$RUNNER_TEMP/after"
    - uses: ./.github/actions/production-delivery-identity
      with:
        kind: backend
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      with:
        version: '593.0.0'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      timeout-minutes: 3
      with:
        node-version: '22.23.5'
    - name: Identifier sans cle le format de sauvegarde
      id: backup_format
      run: |
        archive_format="$(node tools/production-code-backup-archive.js inspect "$RUNNER_TEMP/encrypted/prod-backup.enc")"
        echo "format=$archive_format" >> "$GITHUB_OUTPUT"
    - name: Recuperer le plan authentifie du candidat V2
      if: steps.backup_format.outputs.format == 'v2'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python tools/release-cycle.py artifact "$RELEASE_RUN" release-plan "$RUNNER_TEMP/backup-plan"
    - name: Verifier sans cle la provenance V2 du retour
      if: steps.backup_format.outputs.format == 'v2'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node tools/production-code-backup-archive.js validate-source "$RUNNER_TEMP/encrypted/prod-backup.enc" "$RUNNER_TEMP/backup-plan" "$RUNNER_TEMP/backup-plan/request.json" "$RUNNER_TEMP/code-backup-source.json"
    - name: Ouvrir V2 avec son contexte de creation et sa cle dediee
      if: steps.backup_format.outputs.format == 'v2'
      env:
        LIVEPALMES_CODE_BACKUP_KEY_V2: ${{ secrets.LIVEPALMES_CODE_BACKUP_KEY_V2 }}
      run: node tools/production-code-backup-archive.js open-v2 "$RUNNER_TEMP/encrypted/prod-backup.enc" "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/backup-plan/request.json" "$RUNNER_TEMP/code-backup-source.json"
    - name: Ouvrir V1 avec la seule ancienne cle conservee
      if: steps.backup_format.outputs.format == 'legacy-v1'
      env:
        LIVEPALMES_CODE_BACKUP_LEGACY_V1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
      run: node tools/production-code-backup-archive.js open-legacy-v1 "$RUNNER_TEMP/encrypted/prod-backup.enc" "$RUNNER_TEMP/prod-backup"
    - name: Verifier la sauvegarde ouverte avant tout retour arriere
      id: opened
      run: |
        python - <<'PYCODE'
        import json, os
        from pathlib import Path
        report=json.loads((Path(os.environ['RUNNER_TEMP'])/'prod-backup/report.json').read_text())
        active=report.get('sourcePolicyKind')=='a34-portal-session-enforcement-existing-v1'
        optional=report.get('sourcePolicyKind')=='a3-optional-access-app-check-existing-v1'
        if optional and os.environ['B_RESTORE_HOSTING']!='true': raise ValueError('Retour facultatif coordonne code et Hosting obligatoire')
        if active and os.environ['B_RESTORE_HOSTING']!='true': raise ValueError('Retour B coordonne code/Hosting/Rules obligatoire')
        with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            out.write('portal_session_enforcement='+str(active).lower()+'\n')
            if optional: out.write('optional_access=true\n')
        PYCODE
        python tools/direct-csp-production-state.py validate-rollback "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/after/production-after.json"
    - name: Recuperer et verifier production-hosting-after
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_RUN: ${{ inputs.release_run }}
      run: python tools/release-cycle.py artifact "$RELEASE_RUN" production-hosting-after "$RUNNER_TEMP/hosting-after"
      if: inputs.restore_hosting
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      if: inputs.restore_hosting && (steps.opened.outputs.portal_session_enforcement == 'true' || steps.opened.outputs.optional_access == 'true')
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
    - uses: ./.github/actions/production-delivery-identity
      if: inputs.restore_hosting && steps.opened.outputs.portal_session_enforcement != 'true' && steps.opened.outputs.optional_access != 'true'
      with:
        kind: hosting
    - name: Qualifier les regles avant tout retour B
      if: steps.opened.outputs.portal_session_enforcement == 'true'
      run: python tools/portal-session-enforcement-production-rules.py rollback-validate "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/hosting-after"
    - name: Retablir Hosting
      if: inputs.restore_hosting
      run: python tools/direct-csp-production-state.py hosting-rollback "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/hosting-after/production-hosting-after.json"
    - uses: ./.github/actions/production-delivery-identity
      with:
        kind: backend
    - name: Retablir les Functions depuis les archives sauvegardees
      run: python tools/direct-csp-production-state.py rollback "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/after/production-after.json"
    - name: Utiliser le lecteur existant pour conclure le retour facultatif
      if: steps.opened.outputs.optional_access == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
    - name: Verifier le retour facultatif sans modifier les Rules
      if: steps.opened.outputs.optional_access == 'true'
      run: python tools/optional-access-production-policy.py rollback-final "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/production-optional-access-rollback.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always() && steps.opened.outputs.optional_access == 'true'
      with:
        name: production-optional-access-rollback
        path: |
          ${{ runner.temp }}/production-optional-access-rollback.json
          ${{ runner.temp }}/prod-backup/optional-access-rollback-*.json
        if-no-files-found: warn
        retention-days: 14
    - name: Utiliser le lecteur Rules pour conclure le retour B
      if: steps.opened.outputs.portal_session_enforcement == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
        project_id: livepalmes
    - name: Restaurer les regles originales apres code B restaure et atteste
      if: steps.opened.outputs.portal_session_enforcement == 'true'
      run: python tools/portal-session-enforcement-production-rules.py rollback-restore "$RUNNER_TEMP/prod-backup" "$RUNNER_TEMP/production-session-enforcement-rollback.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always() && steps.opened.outputs.portal_session_enforcement == 'true'
      with:
        name: production-session-enforcement-rollback
        path: |
          ${{ runner.temp }}/production-session-enforcement-rollback.json
          ${{ runner.temp }}/prod-backup/session-enforcement-rules/rollback-*.json
        if-no-files-found: warn
        retention-days: 14
    - name: Distinguer installations et tests
      if: always()
      timeout-minutes: 1
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -f "tools/ci-runtime.py" ]; then
          python "tools/ci-runtime.py" timings
        else
          echo "Mesure indisponible pour ce candidat historique ; controles inchanges." >> "$GITHUB_STEP_SUMMARY"
        fi
'on':
  workflow_dispatch:
    inputs:
      release_run:
        description: Identifiant du run de publication a annuler
        required: true
        type: string
      restore_hosting:
        description: Restaurer aussi Hosting (si sa publication a ete tentee)
        required: true
        type: boolean
        default: true
      confirmation:
        description: Restaurer le code sauvegarde sans operation sur les donnees
        required: true
        type: boolean
