name: Ajouter les trois colonnes NAP des engagements par equipes
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      confirmation:
        description: nap-add-team-entry-columns, perimetre approuve dans le chat engagements Clubs
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nap-authorized-team-entry-schema
  cancel-in-progress: false
jobs:
  add:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
      NAP_TEAM_SCHEMA_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7
        with:
          persist-credentials: false
      - name: Verifier le commit et le perimetre
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$NAP_TEAM_SCHEMA_CONFIRMATION" = nap-add-team-entry-columns
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # version: v7
        with:
          node-version: '22'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # version: v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # version: v3
      - name: Preparer et sauvegarder les structures
        env:
          NAP_TEAM_SCHEMA_PHASE: prepare
        run: node tools/add-nap-team-entry-columns.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # version: v4
        with:
          name: nap-team-entry-schema-before
          path: outputs/nap-team-entry-schema-before.json
          if-no-files-found: error
          retention-days: 90
      - name: Ajouter uniquement les colonnes approuvees
        env:
          NAP_TEAM_SCHEMA_PHASE: apply
        run: node tools/add-nap-team-entry-columns.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # version: v4
        if: always()
        with:
          name: nap-team-entry-schema-result
          path: outputs/nap-team-entry-schema-*.json
          if-no-files-found: ignore
          retention-days: 90
