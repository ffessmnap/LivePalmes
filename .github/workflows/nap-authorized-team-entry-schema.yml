name: Ajouter les trois colonnes NAP des engagements par equipes
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      confirmation:
        description: nap-add-team-entry-columns, perimetre approuve dans le chat engagements Clubs
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nap-authorized-team-entry-schema
  cancel-in-progress: false
jobs:
  add:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-test
    env:
      TARGET_FIREBASE_PROJECT: livepalmes-test
      NAP_TEAM_SCHEMA_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verifier le commit et le perimetre
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$NAP_TEAM_SCHEMA_CONFIRMATION" = nap-add-team-entry-columns
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - name: Preparer et sauvegarder les structures
        env:
          NAP_TEAM_SCHEMA_PHASE: prepare
        run: node tools/add-nap-team-entry-columns.js
      - uses: actions/upload-artifact@v4
        with:
          name: nap-team-entry-schema-before
          path: outputs/nap-team-entry-schema-before.json
          if-no-files-found: error
          retention-days: 90
      - name: Ajouter uniquement les colonnes approuvees
        env:
          NAP_TEAM_SCHEMA_PHASE: apply
        run: node tools/add-nap-team-entry-columns.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nap-team-entry-schema-result
          path: outputs/nap-team-entry-schema-*.json
          if-no-files-found: ignore
          retention-days: 90
