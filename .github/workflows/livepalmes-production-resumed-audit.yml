name: Verifier la remise en service du plan40233566184 sans ecriture
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Tester les refus de derive hors reseau
      run: python tests/production-resumed-audit-tests.py
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
        project_id: livepalmes
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
    - name: Verifier les preuves les revisions et le reglage reactive
      run: python tools/verify-production-resumed.py "$RUNNER_TEMP/final-audit"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: production-resumed-verification
        path: |
          ${{ runner.temp }}/final-audit/final-resumed-receipt.json
          ${{ runner.temp }}/final-audit/bcc-resumed-witness.json
        if-no-files-found: error
        retention-days: 14
