name: Préparer l’index des notifications A6 sur TEST
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Commit main exact autorisé
        required: true
        type: string
      confirmation:
        description: Saisir a6-notification-index-test
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
jobs:
  indexes:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firebase-test
    steps:
      - name: Vérifier le périmètre autorisé
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$CONFIRMATION" = "a6-notification-index-test"
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
      - name: Authentifier les deux preuves CI du commit main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, runpy
          from pathlib import Path
          reusable = runpy.run_path('tools/test-verification-evidence.py')['reusable']
          directory = Path(os.environ['RUNNER_TEMP']) / 'a6-index-ci'
          for suite in ('verify-livepalmes', 'publication-offline-v1'):
              if not reusable(os.environ['GITHUB_SHA'], directory / suite, suite):
                  raise SystemExit('Preuve CI main incompatible : ' + suite)
          PY
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Tester la sélection fermée des index
        run: |
          node -e 'const assert=require("node:assert/strict"), m=require("./tools/a6-notification-test-index"); const fields=m.definitions[0];assert.deepEqual(fields.map(f=>[f.fieldPath,f.order]),[["source","ASCENDING"],["runAt","ASCENDING"],["__name__","ASCENDING"]]);assert.equal(m.definitions.length,1);const row={name:"projects/livepalmes-test/databases/(default)/collectionGroups/engagementClosureQueue/indexes/fixture",queryScope:"COLLECTION",fields};assert.ok(m.matching(row,fields));assert.ok(!m.matching({...row,name:row.name.replace("livepalmes-test","livepalmes")},fields))'
      - name: Utiliser uniquement le compte de service TEST
        env:
          TEST_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
        run: |
          umask 077
          credentials_file="$RUNNER_TEMP/a6-notification-index-test.json"
          printf '%s' "$TEST_CREDENTIALS" > "$credentials_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"
          node -e 'if(JSON.parse(require("fs").readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS)).project_id!=="livepalmes-test")throw Error("Compte TEST requis")'
          gcloud auth activate-service-account --key-file="$credentials_file" --project=livepalmes-test >/dev/null
      - name: Ajouter le seul index autorisé sans suppression ni écriture métier
        run: node tools/a6-notification-test-index.js --apply-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a6-notification-index-proof
          path: a6-notification-index-proof.json
          if-no-files-found: error
