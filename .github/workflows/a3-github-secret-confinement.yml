name: Transfert chiffre ponctuel A3 des cles existantes
on:
  workflow_dispatch:
    inputs:
      scope:
        required: true
        type: choice
        options: [repository, production, firebase-test]
permissions:
  contents: read
concurrency:
  group: a3-github-secret-confinement
  cancel-in-progress: false
jobs:
  transfer:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.A3_SECRET_TRANSFER_ENABLED == 'true'
    environment: ${{ inputs.scope == 'firebase-test' && 'firebase-test' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
      - name: Chiffrer pour le seul destinataire fixe et verifie
        env:
          A3_TRANSFER_SCOPE: ${{ inputs.scope }}
          FIREBASE_SERVICE_ACCOUNT_LIVEPALMES: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
          FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
          FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST }}
          FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
        run: node tools/a3-github-secret-transfer.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a3-existing-credentials-${{ inputs.scope }}
          path: tmp/a3-secret-transfer/credentials.enc.json
          if-no-files-found: error
          retention-days: 1
