name: Verifier la cle independante de sauvegarde code
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Commit main exact valide par la CI ; archive fictive uniquement
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: production-code-backup-key-check
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.expected_commit == github.sha
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Authentifier la CI du circuit main exact
        id: ci
        run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/code-backup-key-ci"
      - name: Refuser une preuve CI absente ou incompatible
        env:
          VERIFIED: ${{ steps.ci.outputs.verified }}
        run: test "$VERIFIED" = true
      - name: Sceller et rouvrir uniquement une archive fictive
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
          LIVEPALMES_CODE_BACKUP_KEY_V2: ${{ secrets.LIVEPALMES_CODE_BACKUP_KEY_V2 }}
        run: node tools/production-code-backup-key-check.js "$RUNNER_TEMP/code-backup-key-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-backup-key-proof
          path: ${{ runner.temp }}/code-backup-key-proof/code-backup-key-check.json
          if-no-files-found: error
          retention-days: 14
