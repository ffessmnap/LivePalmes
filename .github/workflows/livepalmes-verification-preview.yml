name: Verification et apercu LivePalmes

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: livepalmes-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' || github.event.label.name == 'apercu-test' }}

env:
  npm_config_fetch_retries: '2'
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retry_mintimeout: '1000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  application:
    name: Verification applicative
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview: ${{ steps.preview-scope.outputs.preview }}
    steps:
      - name: Recuperer la version a verifier
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determiner si un apercu est utile
        id: preview-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/preview-scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Determiner les tests Firestore necessaires
        id: test-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/test-verification-evidence.py scope

      - name: Installer Node.js
        if: steps.test-scope.outputs.documentation != 'true'
        uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/firestore-rules/package-lock.json

      - name: Installer Java 21
        if: steps.test-scope.outputs.firestore == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reutiliser les suites PR de contenu identique
        id: reused
        if: steps.test-scope.outputs.documentation != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci-suite-evidence.py reuse "$RUNNER_TEMP/ci-suites" application firestore mysql

      - name: Installer les dependances des Functions
        if: steps.test-scope.outputs.documentation != 'true' && (steps.reused.outputs.application != 'true' || steps.reused.outputs.mysql != 'true')
        run: npm ci --prefix functions

      - name: Installer les dependances des tests Firestore
        if: steps.test-scope.outputs.documentation != 'true' && (steps.reused.outputs.application != 'true' || (steps.test-scope.outputs.firestore == 'true' && steps.reused.outputs.firestore != 'true'))
        run: npm ci --prefix tests/firestore-rules

      - name: Tester les regles Firestore
        if: steps.test-scope.outputs.firestore == 'true' && steps.reused.outputs.firestore != 'true'
        run: npm --prefix tests/firestore-rules test

      - name: Verifier LivePalmes
        if: steps.test-scope.outputs.documentation != 'true' && steps.reused.outputs.application != 'true'
        run: node tools/verify-livepalmes.js

      - name: Verifier les ecritures par equipes dans MySQL isole
        if: ${{ !cancelled() && steps.test-scope.outputs.documentation != 'true' && steps.reused.outputs.mysql != 'true' }}
        env:
          NAP_TEAM_FIXTURE_ALLOWED: isolated-ci
          NAP_TEAM_FIXTURE_PASSWORD: isolated-team-fixture-only
        run: |
          docker run -d --name livepalmes-team-mysql -e MYSQL_ROOT_PASSWORD="$NAP_TEAM_FIXTURE_PASSWORD" -e MYSQL_ROOT_HOST=% -p 127.0.0.1:33317:3306 mysql:5.7.30@sha256:32f9d9a069f7a735e28fd44ea944d53c61f990ba71460c5c183e610854ca4854
          trap 'docker rm -f livepalmes-team-mysql >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if docker exec livepalmes-team-mysql mysqladmin ping --protocol=TCP -h127.0.0.1 -uroot -p"$NAP_TEAM_FIXTURE_PASSWORD" --silent >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node tests/nap-team-entry-mysql-tests.js
          node tests/nap-club-account-emails-mysql-tests.js
          node tests/nap-direct-mysql-tests.js

      - name: Enregistrer les preuves des suites applicatives
        if: steps.test-scope.outputs.documentation != 'true'
        env:
          FIRESTORE_REQUIRED: ${{ steps.test-scope.outputs.firestore }}
        run: python tools/ci-suite-evidence.py record "$RUNNER_TEMP/ci-suites" application firestore mysql

      - uses: actions/upload-artifact@v4
        if: steps.test-scope.outputs.documentation != 'true'
        with:
          name: ci-application-suites
          path: |
            ${{ runner.temp }}/ci-suites/application.json
            ${{ runner.temp }}/ci-suites/firestore.json
            ${{ runner.temp }}/ci-suites/mysql.json
          if-no-files-found: error
          retention-days: 14

      - name: Enregistrer la verification du commit main exact
        if: github.event_name == 'push' && steps.test-scope.outputs.documentation != 'true'
        run: python tools/test-verification-evidence.py record "$RUNNER_TEMP/application-verification"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && steps.test-scope.outputs.documentation != 'true'
        with:
          name: application-verification
          path: ${{ runner.temp }}/application-verification/verification.json
          if-no-files-found: error
          retention-days: 14

  publication:
    name: Verification du circuit de publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer la version a verifier
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determiner si un apercu est utile
        id: preview-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/preview-scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Determiner les tests Firestore necessaires
        id: test-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/test-verification-evidence.py scope

      - name: Installer Node.js
        if: steps.test-scope.outputs.documentation != 'true'
        uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/firestore-rules/package-lock.json

      - name: Installer Java 21
        if: steps.test-scope.outputs.firestore == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reutiliser les suites PR de contenu identique
        id: reused
        if: steps.test-scope.outputs.documentation != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci-suite-evidence.py reuse "$RUNNER_TEMP/ci-suites" publication

      - name: Installer les dependances des Functions
        if: steps.test-scope.outputs.documentation != 'true' && steps.reused.outputs.publication != 'true'
        run: npm ci --prefix functions

      - name: Installer les dependances des tests Firestore
        if: steps.test-scope.outputs.documentation != 'true' && steps.reused.outputs.publication != 'true'
        run: npm ci --prefix tests/firestore-rules

      - name: Tester le circuit de publication sans acces Firebase
        if: steps.test-scope.outputs.documentation != 'true' && steps.reused.outputs.publication != 'true'
        run: |
          # Covered by required application job: node tests/release-excluded-backend-compatibility-tests.js
          # Covered by required application job: node tests/nap-national-documents-callable-tests.js
          # Covered by required application job: node tests/release-c0-compatibility-tests.js
          # Covered by required application job: node tests/release-home-compatibility-tests.js
          # Covered by required application job: node tests/production-notification-preparation-tests.js
          node tests/release-function-fingerprints-tests.js
          python tests/release-cycle-tests.py
          python tests/release-preflight-review-tests.py
          python tests/release-composed-evidence-tests.py
          python tests/production-release-state-tests.py
          python tests/production-grouped-release-tests.py
          python tests/bcc-publication-tests.py
          python tests/all-validated-publication-tests.py
          python tests/production-resumed-audit-tests.py
          python tests/production-account-history-indexes-tests.py
          python tests/validated-20261026-publication-tests.py
          python tests/validated-20261027-publication-tests.py
          python tests/scheduler-iam-preparation-tests.py
          python tests/production-release-source-tests.py
          node tests/production-backup-crypto-tests.js
          node tests/hosting-payload-tests.js
          python tests/preview-scope-tests.py
          python tests/test-publication-coordination-tests.py
          python tests/portal-session-rules-tests.py
          python tests/test-static-cache-policy-tests.py
          node tests/nap-source-diagnostic-tests.js
          python tests/test-verification-evidence-tests.py
          python tests/ci-runtime-tests.py
          python tests/ci-suite-evidence-tests.py
          python tests/production-pdf-functions-tests.py
          python tests/production-notification-release-tests.py
          python tests/production-access-request-release-tests.py
          python tests/publication-fast-paths-tests.py
          python tests/release-simplification-tests.py
          python tests/license-report-release-tests.py
          python tests/nap-retained-source-tests.py
            python tests/november-validated-release-tests.py
            python tests/november10-validated-release-tests.py
            python tests/reference-cleanup-production-tests.py
            python tests/public-navigation-direct-production-tests.py
            python tests/public-navigation-touch-production-tests.py
            node tests/november-retained-scope-tests.js
          python tests/test-mail-sources-tests.py
          python tests/test-trophy-sources-tests.py
          python tests/test-import-sources-tests.py
          python tests/test-reference-cleanup-sources-tests.py
          python tests/test-swimmer-reference-cleanup-sources-tests.py
          python tests/test-reference-migration-cleanup-sources-tests.py
          python tests/test-reference-recovery-sources-tests.py
          python tests/test-direct-sources-tests.py
          python tests/test-direct-archive-sources-tests.py
          python tests/test-direct-layout-sources-tests.py
          python tests/test-direct-access-sources-tests.py
          python tests/test-direct-public-sources-tests.py
          python tests/test-public-navigation-sources-tests.py
          python tests/test-public-navigation-touch-sources-tests.py
          python tests/test-direct-participation-sources-tests.py
          python tests/test-direct-import-sources-tests.py
          python tests/nap-account-release-tests.py
          node tests/release-nap-account-compatibility.js
          node tests/license-report-source-guard-tests.js

      - name: Enregistrer la preuve de la suite publication
        if: steps.test-scope.outputs.documentation != 'true'
        run: python tools/ci-suite-evidence.py record "$RUNNER_TEMP/ci-suites" publication

      - uses: actions/upload-artifact@v4
        if: steps.test-scope.outputs.documentation != 'true'
        with:
          name: ci-publication-suites
          path: ${{ runner.temp }}/ci-suites/publication.json
          if-no-files-found: error
          retention-days: 14

      - name: Enregistrer la verification du circuit main exact
        if: github.event_name == 'push' && steps.test-scope.outputs.documentation != 'true'
        run: python tools/test-verification-evidence.py record-publication "$RUNNER_TEMP/publication-verification"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && steps.test-scope.outputs.documentation != 'true'
        with:
          name: publication-verification
          path: ${{ runner.temp }}/publication-verification/verification.json
          if-no-files-found: error
          retention-days: 14


  browser:
    name: Verification navigateur hors ligne
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDGE_BIN: /usr/bin/google-chrome
      LIVEPALMES_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NODE_PATH: ${{ github.workspace }}/tests/browser/node_modules
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determiner les parcours necessaires
        id: test-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/test-verification-evidence.py scope

      - name: Installer Node.js
        if: steps.test-scope.outputs.documentation != 'true'
        uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/firestore-rules/package-lock.json
            tests/browser/package-lock.json

      - name: Reutiliser la preuve navigateur de contenu identique
        id: reused
        if: steps.test-scope.outputs.documentation != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci-suite-evidence.py reuse "$RUNNER_TEMP/ci-suites" browser

      - name: Installer les dependances navigateur verrouillees
        if: steps.test-scope.outputs.documentation != 'true' && steps.reused.outputs.browser != 'true'
        run: |
          npm ci --prefix functions
          npm ci --prefix tests/firestore-rules
          npm ci --prefix tests/browser --ignore-scripts

      - name: Verifier les parcours navigateur isoles
        if: steps.test-scope.outputs.documentation != 'true' && steps.reused.outputs.browser != 'true'
        run: node tools/verify-livepalmes.js --browser-only

      - name: Enregistrer la preuve navigateur
        if: steps.test-scope.outputs.documentation != 'true'
        run: python tools/ci-suite-evidence.py record "$RUNNER_TEMP/ci-suites" browser

      - uses: actions/upload-artifact@v4
        if: steps.test-scope.outputs.documentation != 'true'
        with:
          name: ci-browser-suites
          path: ${{ runner.temp }}/ci-suites/browser.json
          if-no-files-found: error
          retention-days: 14

  verification:
    name: Verification technique
    needs: [application, publication, browser]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ needs.application.outputs.preview }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Exiger toutes les verifications
        env:
          APPLICATION: ${{ needs.application.result }}
          PUBLICATION: ${{ needs.publication.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$APPLICATION" = success && test "$PUBLICATION" = success && test "$BROWSER" = success

      - name: Distinguer installations et tests
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci-runtime.py timings

  apercu:
    name: Creer un apercu isole
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'apercu-test') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.verification.outputs.preview == 'true' &&
      vars.FIREBASE_TEST_ENABLED == 'true'
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Recuperer la version validee
        uses: actions/checkout@v7

      - name: Verifier la disponibilite du deploiement TEST
        id: firebase-test
        shell: bash
        env:
          FIREBASE_TEST_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST }}
        run: |
          if [ -z "$FIREBASE_TEST_CREDENTIALS" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Le secret FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST est absent : deploiement TEST ignore."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier un apercu de la PR
        if: steps.firebase-test.outputs.enabled == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          disableComment: true
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST }}
          projectId: livepalmes-test
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 3d
