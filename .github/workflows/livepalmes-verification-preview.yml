name: Verification et apercu LivePalmes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: livepalmes-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Verification technique
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview: ${{ steps.preview-scope.outputs.preview }}
    steps:
      - name: Recuperer la version a verifier
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determiner si un apercu est utile
        id: preview-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/preview-scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Lire la version Node.js du projet
        id: node-version
        shell: bash
        run: |
          node -p '"version=" + require("./functions/package.json").engines.node' >> "$GITHUB_OUTPUT"

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/firestore-rules/package-lock.json

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dependances des Functions
        run: npm ci --prefix functions

      - name: Installer les dependances des tests Firestore
        run: npm ci --prefix tests/firestore-rules

      - name: Tester les regles Firestore
        run: npm --prefix tests/firestore-rules test

      - name: Verifier LivePalmes
        run: node tools/verify-livepalmes.js

      - name: Tester le circuit de publication sans acces Firebase
        run: |
          node tests/release-function-fingerprints-tests.js
          python tests/release-cycle-tests.py
          python tests/production-release-state-tests.py
          python tests/production-release-source-tests.py
          node tests/production-backup-crypto-tests.js
          node tests/hosting-payload-tests.js
          python tests/preview-scope-tests.py

  apercu:
    name: Creer un apercu isole
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.verification.outputs.preview == 'true' &&
      vars.FIREBASE_TEST_ENABLED == 'true'
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Recuperer la version validee
        uses: actions/checkout@v7

      - name: Verifier la disponibilite du deploiement TEST
        id: firebase-test
        shell: bash
        env:
          FIREBASE_TEST_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST }}
        run: |
          if [ -z "$FIREBASE_TEST_CREDENTIALS" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Le secret FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST est absent : deploiement TEST ignore."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier un apercu de la PR
        if: steps.firebase-test.outputs.enabled == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          disableComment: true
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST }}
          projectId: livepalmes-test
          channelId: pr-${{ github.event.pull_request.number }}
