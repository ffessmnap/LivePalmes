name: Deplacer les bilans licences autorises dans NAP
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      confirmation:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nap-authorized-license-reports
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-test
    env:
      NAP_LICENSE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verifier la version et la confirmation
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$NAP_LICENSE_CONFIRMATION" = "nap-license-reports-history"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --ignore-scripts
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
          project_id: livepalmes
      - uses: google-github-actions/setup-gcloud@v3
      - name: Lire uniquement les bilans officiels PROD
        env:
          NAP_LICENSE_PHASE: export
        run: node tools/migrate-nap-license-reports.js
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - name: Preparer la reprise sans ecriture
        env:
          NAP_LICENSE_PHASE: prepare
        run: node tools/migrate-nap-license-reports.js
      - uses: actions/upload-artifact@v4
        with:
          name: nap-license-reports-before
          path: outputs/nap-license-reports/
          if-no-files-found: error
          retention-days: 90
      - name: Ajouter les tables absentes et reprendre les bilans
        env:
          NAP_LICENSE_PHASE: apply
        run: node tools/migrate-nap-license-reports.js
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_BACKEND }}
          project_id: livepalmes
      - name: Verifier que la source officielle est restee identique
        env:
          NAP_LICENSE_PHASE: export
        run: |
          cp outputs/nap-license-reports/source.json outputs/nap-license-reports/source-before.json
          node tools/migrate-nap-license-reports.js
          node -e 'const fs=require("fs"); const p="outputs/nap-license-reports/"; if(JSON.parse(fs.readFileSync(p+"source.json")).hash!==JSON.parse(fs.readFileSync(p+"source-before.json")).hash)process.exit(1)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nap-license-reports-result
          path: outputs/nap-license-reports/
          if-no-files-found: ignore
          retention-days: 90
