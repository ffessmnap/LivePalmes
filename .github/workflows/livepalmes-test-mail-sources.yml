name: Completer les sources mails TEST sans envoi
on:
  workflow_dispatch:
    inputs:
      release:
        description: Lot autorise avec son contrat ferme au candidat applicatif exact
        required: true
        type: choice
        options: [models, decisions, contacts, reminder, officials_txt, contacts_three, officials_dates, trophy_departmental, import_resolution]
      expected_commit:
        description: Commit main exact ayant reussi les deux suites CI
        required: true
        type: string
      confirmation:
        description: Saisir livepalmes-test ; sources seulement, etats deja suspendus inchanges
        required: true
        type: string
      identity_only:
        description: Confirmer uniquement le client_email attendu, sans lecture metier ni publication
        required: false
        default: false
        type: boolean
      recover_models:
        description: Recuperer en lecture seule les preuves du seul run models 42454743001
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
jobs:
  sources:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirmation == 'livepalmes-test' && inputs.expected_commit == github.sha && !(inputs.identity_only && inputs.recover_models) && !(inputs.release == 'trophy_departmental' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'import_resolution' && (inputs.identity_only || inputs.recover_models))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firebase-test
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_FIREBASE_PROJECT: livepalmes-test
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE: ${{ inputs.release }}
      SOURCE_TOOL: ${{ inputs.release == 'import_resolution' && 'publish-test-import-sources.py' || inputs.release == 'trophy_departmental' && 'publish-test-trophy-sources.py' || 'publish-test-mail-sources.py' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: candidate
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          check-latest: true
      - name: Installer les outils verrouilles de verification des dependances
        run: npm ci --prefix tooling/tests/firestore-rules --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@v3
      - name: Confirmer uniquement le compte backend TEST attendu
        if: inputs.identity_only
        run: python tooling/tools/publish-test-mail-sources.py identity "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - uses: actions/upload-artifact@v4
        if: inputs.identity_only
        with:
          name: test-mail-identity-proof
          path: ${{ runner.temp }}/test-mail-sources/identity-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Authentifier les preuves et constater les preconditions deja satisfaites
        if: ${{ !inputs.identity_only && !inputs.recover_models }}
        run: python tooling/tools/"$SOURCE_TOOL" prepare "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - name: Publier seulement les sources calculees et autorisees
        if: ${{ !inputs.identity_only && !inputs.recover_models }}
        run: python tooling/tools/"$SOURCE_TOOL" deploy "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - name: Verifier revisions et preservation de tous les etats
        if: ${{ !inputs.identity_only && !inputs.recover_models }}
        run: python tooling/tools/"$SOURCE_TOOL" verify "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - name: Recuperer la preuve du run models engage sans publication
        if: inputs.recover_models && !inputs.identity_only
        run: python tooling/tools/publish-test-mail-sources.py recover "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.identity_only }}
        with:
          name: test-backend-proof
          path: ${{ runner.temp }}/test-mail-sources/test-backend-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Conserver uniquement les temoins techniques non sensibles en cas d echec
        if: failure() && !inputs.identity_only
        run: python tooling/tools/"$SOURCE_TOOL" diagnostic "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - uses: actions/upload-artifact@v4
        if: failure() && !inputs.identity_only
        with:
          name: test-mail-failure-diagnostic
          path: ${{ runner.temp }}/test-mail-sources/failure-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
