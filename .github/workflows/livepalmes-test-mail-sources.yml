name: Completer les sources mails TEST sans envoi
on:
  workflow_dispatch:
    inputs:
      release:
        description: Lot autorise avec son contrat ferme au candidat applicatif exact
        required: true
        type: choice
        options: [standard, a4_dependencies, club_helloasso_pdf, organizer_fees_layout, organizer_fees, admin_mfa_optional, admin_mfa_enforcement, portal_session_enforcement, portal_session_prepare, access_revocation, direct_realtime, direct_reliability, public_navigation_touch, direct_date_archive, public_navigation, models, decisions, contacts, reminder, officials_txt, contacts_three, officials_dates, trophy_departmental, import_resolution, direct_console_audit, direct_bureau_layout, direct_access, direct_public_sessions, direct_participations, direct_import_completeness, club_reference_cleanup, club_reference_cleanup_recovery, swimmer_reference_cleanup, reference_migration_cleanup]
      standard_request:
        description: Manifeste standard genere, candidat exact, baseline TEST et accord sources/labels
        required: false
        default: ''
        type: string
      expected_commit:
        description: Commit main exact ayant reussi les deux suites CI
        required: true
        type: string
      confirmation:
        description: Saisir livepalmes-test ; sources seulement, etats deja suspendus inchanges
        required: true
        type: string
      identity_only:
        description: Confirmer uniquement le client_email attendu, sans lecture metier ni publication
        required: false
        default: false
        type: boolean
      recover_models:
        description: Recuperer en lecture seule les preuves du seul run models 42454743001
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: livepalmes-test-backend
  cancel-in-progress: false
env:
  npm_config_fetch_retries: '2'
  npm_config_fetch_timeout: '30000'
  npm_config_fetch_retry_mintimeout: '1000'
  npm_config_fetch_retry_maxtimeout: '10000'

jobs:
  sources:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirmation == 'livepalmes-test' && inputs.expected_commit == github.sha && !(inputs.identity_only && inputs.recover_models) && !(inputs.release == 'a4_dependencies' && (inputs.identity_only || inputs.recover_models || inputs.standard_request != '')) && !((inputs.release == 'club_helloasso_pdf' || inputs.release == 'organizer_fees_layout') && (inputs.identity_only || inputs.recover_models || inputs.standard_request != '')) && !(inputs.release == 'organizer_fees' && (inputs.identity_only || inputs.recover_models || inputs.standard_request != '')) && !(inputs.release == 'admin_mfa_optional' && (inputs.identity_only || inputs.recover_models || inputs.standard_request != '')) && !(inputs.release == 'admin_mfa_enforcement' && (inputs.identity_only || inputs.recover_models || inputs.standard_request != '')) && !(inputs.release == 'portal_session_enforcement' && (inputs.identity_only || inputs.recover_models || inputs.standard_request != '')) && !(inputs.release == 'portal_session_prepare' && (inputs.identity_only || inputs.recover_models || inputs.standard_request != '')) && !(inputs.release == 'access_revocation' && (inputs.identity_only || inputs.recover_models || inputs.standard_request != '')) && !(inputs.release == 'standard' && (inputs.identity_only || inputs.recover_models || inputs.standard_request == '')) && !(inputs.release == 'public_navigation_touch' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'direct_realtime' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'direct_reliability' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'direct_date_archive' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'trophy_departmental' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'import_resolution' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'direct_console_audit' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'direct_bureau_layout' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'direct_access' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'direct_public_sessions' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'direct_import_completeness' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'direct_participations' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'club_reference_cleanup' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'club_reference_cleanup_recovery' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'swimmer_reference_cleanup' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'reference_migration_cleanup' && (inputs.identity_only || inputs.recover_models)) && !(inputs.release == 'public_navigation' && (inputs.identity_only || inputs.recover_models))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.release == 'a4_dependencies' || inputs.release == 'admin_mfa_optional' || inputs.release == 'admin_mfa_enforcement' || inputs.release == 'portal_session_enforcement' || inputs.release == 'portal_session_prepare' || inputs.release == 'access_revocation' || inputs.release == 'club_reference_cleanup' || inputs.release == 'club_reference_cleanup_recovery' || inputs.release == 'swimmer_reference_cleanup' || inputs.release == 'reference_migration_cleanup') && 120 || 45 }}
    environment: firebase-test
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_FIREBASE_PROJECT: livepalmes-test
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE: ${{ inputs.release }}
      STANDARD_SOURCE_REQUEST: ${{ inputs.standard_request }}
      SOURCE_TOOL: ${{ inputs.release == 'a4_dependencies' && 'publish-test-a4-dependencies.py' || inputs.release == 'club_helloasso_pdf' && 'publish-test-club-helloasso-pdf.py' || inputs.release == 'organizer_fees_layout' && 'publish-test-organizer-fees-layout.py' || inputs.release == 'organizer_fees' && 'publish-test-organizer-fees.py' || inputs.release == 'admin_mfa_optional' && 'publish-test-admin-mfa-optional.py' || inputs.release == 'admin_mfa_enforcement' && 'publish-test-admin-mfa-sources.py' || inputs.release == 'portal_session_enforcement' && 'publish-test-portal-session-enforcement.py' || inputs.release == 'portal_session_prepare' && 'publish-test-portal-session-prepare.py' || inputs.release == 'access_revocation' && 'publish-test-access-revocation-sources.py' || inputs.release == 'direct_realtime' && 'publish-test-direct-realtime-sources.py' || inputs.release == 'direct_reliability' && 'publish-test-direct-reliability-sources.py' || inputs.release == 'standard' && 'publish-test-standard-sources.py' || inputs.release == 'public_navigation_touch' && 'publish-test-public-navigation-touch-sources.py' || inputs.release == 'direct_date_archive' && 'publish-test-direct-archive-sources.py' || inputs.release == 'public_navigation' && 'publish-test-public-navigation-sources.py' || inputs.release == 'reference_migration_cleanup' && 'publish-test-reference-migration-cleanup-sources.py' || inputs.release == 'swimmer_reference_cleanup' && 'publish-test-swimmer-reference-cleanup-sources.py' || inputs.release == 'club_reference_cleanup_recovery' && 'publish-test-reference-recovery-sources.py' || inputs.release == 'club_reference_cleanup' && 'publish-test-reference-cleanup-sources.py' || inputs.release == 'direct_import_completeness' && 'publish-test-direct-import-sources.py' || inputs.release == 'direct_participations' && 'publish-test-direct-participation-sources.py' || inputs.release == 'direct_public_sessions' && 'publish-test-direct-public-sources.py' || inputs.release == 'direct_access' && 'publish-test-direct-access-sources.py' || inputs.release == 'direct_bureau_layout' && 'publish-test-direct-layout-sources.py' || inputs.release == 'direct_console_audit' && 'publish-test-direct-sources.py' || inputs.release == 'import_resolution' && 'publish-test-import-sources.py' || inputs.release == 'trophy_departmental' && 'publish-test-trophy-sources.py' || 'publish-test-mail-sources.py' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tooling
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: candidate
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Installer les outils verrouilles de verification des dependances
        run: npm ci --prefix tooling/tests/firestore-rules --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES_TEST_BACKEND }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Confirmer uniquement le compte backend TEST attendu
        if: inputs.identity_only
        run: python tooling/tools/publish-test-mail-sources.py identity "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.identity_only
        with:
          name: test-mail-identity-proof
          path: ${{ runner.temp }}/test-mail-sources/identity-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Authentifier les preuves et constater les preconditions deja satisfaites
        if: ${{ !inputs.identity_only && !inputs.recover_models }}
        run: python tooling/tools/"$SOURCE_TOOL" prepare "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - name: Conserver les references de retour A4 avant toute mise a jour
        if: inputs.release == 'a4_dependencies'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a4-test-source-recovery-before
          path: ${{ runner.temp }}/test-mail-sources/a4-source-recovery.json
          retention-days: 14
          if-no-files-found: error
      - name: Rouvrir le manifeste A4 archive dans ce lancement
        if: inputs.release == 'a4_dependencies'
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name a4-test-source-recovery-before --dir "$RUNNER_TEMP/test-mail-sources/reopened"
      - name: Publier seulement les sources calculees et autorisees
        if: ${{ !inputs.identity_only && !inputs.recover_models }}
        run: python tooling/tools/"$SOURCE_TOOL" deploy "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - name: Verifier revisions et preservation de tous les etats
        if: ${{ !inputs.identity_only && !inputs.recover_models }}
        run: python tooling/tools/"$SOURCE_TOOL" verify "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - name: Recuperer la preuve du run models engage sans publication
        if: inputs.recover_models && !inputs.identity_only
        run: python tooling/tools/publish-test-mail-sources.py recover "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.identity_only }}
        with:
          name: test-backend-proof
          path: ${{ runner.temp }}/test-mail-sources/test-backend-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Conserver uniquement les temoins techniques non sensibles en cas d echec
        if: failure() && !inputs.identity_only
        run: python tooling/tools/"$SOURCE_TOOL" diagnostic "$RELEASE" "$RUNNER_TEMP/test-mail-sources" candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && !inputs.identity_only
        with:
          name: test-mail-failure-diagnostic
          path: ${{ runner.temp }}/test-mail-sources/failure-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
      - name: Distinguer installations et tests
        if: always()
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "tooling/tools/ci-runtime.py" ]; then
            python "tooling/tools/ci-runtime.py" timings
          else
            echo "Mesure indisponible pour ce candidat historique ; controles inchanges." >> "$GITHUB_STEP_SUMMARY"
          fi
