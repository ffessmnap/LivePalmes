name: Observer uniquement la configuration MFA PROD
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Main exact controle CI
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: a3-mfa-production-config
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.expected_commit == github.sha
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Authentifier la CI exacte avant credential
        id: ci
        run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/a3-production-mfa-ci"
      - name: Verifier le contexte avant credential
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: node -e "require('./tools/a3-mfa-production-inspect').context(process.env)"
      - name: Installer les dependances verrouillees
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Utiliser seulement l'identite PROD existante
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVEPALMES }}
          project_id: livepalmes
      - name: Observer seulement la configuration et les deux permissions
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: node tools/a3-mfa-production-inspect.js "$RUNNER_TEMP/a3-mfa-production-inspect"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: a3-mfa-production-inspection
          path: ${{ runner.temp }}/a3-mfa-production-inspect/production-mfa-inspection.json
          if-no-files-found: warn
          retention-days: 14
