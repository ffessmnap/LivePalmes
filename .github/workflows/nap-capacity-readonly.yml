name: Observer la capacite NAP sans modification
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Commit main exact CI verte ; deux requetes de metadonnees sur NAP partagee
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: nap-database-backup
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.expected_commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nap-backup
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.5'
          check-latest: false
      - name: Authentifier la CI main avant les identites cloud
        run: python tools/a3-cloud-metadata.py verify-ci "$RUNNER_TEMP/a3-sql-ci" sql
      - name: Installer les dependances deja verrouillees sans script
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.NAP_BACKUP_SERVICE_ACCOUNT_JSON }}
          project_id: livepalmes-test
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Lire deux requetes administratives sans table metier ni verrou
        run: node tools/nap-capacity-readonly.js "$RUNNER_TEMP/nap-capacity.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nap-capacity-readonly
          path: ${{ runner.temp }}/nap-capacity.json
          if-no-files-found: warn
          retention-days: 14
