name: Qualifier les consommateurs de publication WIF sans publier
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Main exact valide CI ; nouveau fournisseur et deux liens doivent avoir ete autorises
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: a3-production-wif-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.expected_commit == github.sha
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: hosting
            account: github-actions-livepalmes@livepalmes.iam.gserviceaccount.com
          - kind: backend
            account: github-actions-livepalmes-back@livepalmes.iam.gserviceaccount.com
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      WIF_READER_KIND: ${{ matrix.kind }}
      GOOGLE_CLOUD_PROJECT: livepalmes
      GCLOUD_PROJECT: livepalmes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        timeout-minutes: 3
        with:
          node-version: '22.23.5'
          check-latest: false
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/firestore-rules/package-lock.json
      - name: Authentifier la CI publication du main exact
        id: ci
        run: python tools/test-verification-evidence.py reuse-publication "$RUNNER_TEMP/a3-production-wif-ci"
      - name: Exiger cette preuve avant toute federation
        run: test '${{ steps.ci.outputs.verified }}' = true
      - name: Installer les consommateurs deja verrouilles
        run: |
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/firestore-rules --ignore-scripts --no-audit --no-fund
      - name: Identite ephemere du seul compte existant de la matrice
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: livepalmes
          workload_identity_provider: projects/718081132564/locations/global/workloadIdentityPools/livepalmes-github/providers/github-production-delivery
          audience: https://iam.googleapis.com/projects/718081132564/locations/global/workloadIdentityPools/livepalmes-github/providers/github-production-delivery
          service_account: ${{ matrix.account }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '593.0.0'
      - name: Qualifier les SDK CLI et gcloud apres expiration reelle
        env:
          VERIFIED_MAIN_CI: ${{ steps.ci.outputs.verified }}
        run: python tools/a3-production-wif-qualification.py "$RUNNER_TEMP/a3-production-wif-${{ matrix.kind }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a3-production-wif-${{ matrix.kind }}
          path: ${{ runner.temp }}/a3-production-wif-${{ matrix.kind }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Distinguer installations et tests
        if: always()
        timeout-minutes: 1
        run: python tools/ci-runtime.py timings
