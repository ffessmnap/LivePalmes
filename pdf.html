<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF - LivePalmes</title>
    <meta name="theme-color" content="#0b7285">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LP Public">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/png" href="logo-livepalmes.png?v=20260528-result-modal-wide-ns-fix">
    <link rel="apple-touch-icon" href="apple-touch-icon-public.png?v=20260528-result-modal-wide-ns-fix">
    <link rel="manifest" href="manifest-public.webmanifest?v=20260528-result-modal-wide-ns-fix">
    <link rel="stylesheet" href="styles.css?v=20260528-result-modal-wide-ns-fix">
    <link rel="stylesheet" href="public.css?v=20260528-result-modal-wide-ns-fix">
  </head>
  <body class="public-results-page pdf-viewer-page">
    <header class="public-results-header">
      <div>
        <p class="eyebrow app-name">
          <span class="livepalmes-logo" aria-hidden="true">
            <img src="logo-livepalmes.png?v=20260528-result-modal-wide-ns-fix" alt="">
          </span>
          LivePalmes
        </p>
        <span id="pdfMeetMeta" class="pdf-meet-meta"></span>
        <h1 id="pdfTitle">PDF</h1>
      </div>
      <div class="pdf-header-actions">
        <a id="pdfDownloadBtn" class="ghost-button compact confirm-button" href="#" download hidden>T&eacute;l&eacute;charger</a>
        <button id="pdfCloseBtn" class="ghost-button compact" type="button">Retour</button>
      </div>
    </header>

    <main class="pdf-viewer-shell">
      <div id="pdfViewerStatus" class="panel">
        <p class="panel-subtitle">Chargement du PDF...</p>
      </div>
      <div id="pdfCanvasViewer" class="pdf-canvas-viewer" hidden></div>
      <iframe id="pdfFrame" class="pdf-frame" title="PDF LivePalmes" hidden></iframe>
      <div id="pdfFallback" class="panel pdf-fallback" hidden></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="pdf.js?v=20260528-result-modal-wide-ns-fix"></script>
  </body>
</html>
