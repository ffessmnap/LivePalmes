<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF résultat - LivePalmes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260516-livepalmes-icon">
    <link rel="stylesheet" href="styles.css?v=20260517-public-sex-colors">
  </head>
  <body class="public-results-page pdf-viewer-page">
    <header class="public-results-header">
      <div>
        <p class="eyebrow app-name">
          <span class="livepalmes-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" focusable="false">
              <rect class="logo-card" x="3.5" y="9" width="17" height="14" rx="3.2"/>
              <path class="logo-card-line" d="M8 14h7.8M8 18h5.2"/>
              <circle class="logo-live-dot" cx="21.5" cy="10.2" r="3.2"/>
              <path class="logo-wave" d="M23.9 16c1.5.8 2.7 2 3.4 3.5M25.6 12.5c2.5 1.2 4.4 3.2 5.4 5.8"/>
            </svg>
          </span>
          LivePalmes
        </p>
        <h1 id="pdfTitle">Résultat</h1>
      </div>
      <a class="ghost-button compact" href="resultats.html">Retour</a>
    </header>

    <main class="pdf-viewer-shell">
      <div id="pdfViewerStatus" class="panel">
        <p class="panel-subtitle">Chargement du PDF...</p>
      </div>
      <iframe id="pdfFrame" class="pdf-frame" title="PDF résultat" hidden></iframe>
      <div id="pdfFallback" class="panel pdf-fallback" hidden></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="resultat-pdf.js?v=20260517-direct-pdf"></script>
