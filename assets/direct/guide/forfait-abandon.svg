<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" role="img" aria-labelledby="title desc"><title id="title">Circuits du forfait et de l’abandon</title><desc id="desc">Un forfait est transmis au bureau et au secrétariat actif. Un abandon est transmis au bureau. Dans les deux cas, la saisie WinPalme puis le TXT actualisent le public.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#315e75"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:15px;fill:#183a4e;text-anchor:middle}.head{font-weight:700}.box{fill:#f4f8fb;stroke:#a5becc;stroke-width:1.5}.start{fill:#e4f1f6;stroke:#5592ab}.end{fill:#edf7f0;stroke:#81b497}.line{fill:none;stroke:#315e75;stroke-width:2;marker-end:url(#arrow)}</style>
<rect class="box start" x="15" y="8" width="350" height="38" rx="8"/><text class="head" x="190" y="32">JA · forfait</text><path class="line" d="M190 46V65"/><rect class="box" x="15" y="69" width="350" height="38" rx="8"/><text x="190" y="93">Bureau + secrétariat actif</text><path class="line" d="M190 107V126"/><rect class="box end" x="15" y="130" width="350" height="35" rx="8"/><text x="190" y="153">WinPalme → TXT → résultat public</text>
<rect class="box start" x="395" y="8" width="350" height="38" rx="8"/><text class="head" x="570" y="32">JA · abandon</text><path class="line" d="M570 46V65"/><rect class="box" x="395" y="69" width="350" height="38" rx="8"/><text x="570" y="93">Bureau des performances</text><path class="line" d="M570 107V126"/><rect class="box end" x="395" y="130" width="350" height="35" rx="8"/><text x="570" y="153">WinPalme → TXT → résultat public</text>
</svg>
