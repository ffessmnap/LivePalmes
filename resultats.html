<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R&eacute;sultats - LivePalmes</title>
    <meta name="description" content="R&eacute;sultats publi&eacute;s et finalistes de la comp&eacute;tition LivePalmes.">
    <meta name="theme-color" content="#0b7285">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LP Public">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/png" href="logo-livepalmes.png?v=20260528-speaker-page">
    <link rel="apple-touch-icon" href="apple-touch-icon-public.png?v=20260528-speaker-page">
    <link rel="manifest" href="manifest-public.webmanifest?v=20260528-speaker-page">
    <link rel="stylesheet" href="styles.css?v=20260528-speaker-page">
    <link rel="stylesheet" href="public.css?v=20260528-speaker-page">
  </head>
  <body class="public-results-page">
    <header class="public-results-header">
      <div>
        <p class="eyebrow app-name">
          <span class="livepalmes-logo" aria-hidden="true">
            <img src="logo-livepalmes.png?v=20260528-speaker-page" alt="">
          </span>
          LivePalmes
        </p>
        <h1 id="publicMeetTitle">R&eacute;sultats</h1>
        <p id="publicMeetMeta" class="public-meet-meta"></p>
      </div>
      <div class="public-header-actions">
        <a class="ghost-button compact public-page-switch" href="series-public.html">Voir les s&eacute;ries</a>
        <span id="publicResultsStatus" class="firebase-header-status pending">
          <i class="firebase-dot pending" aria-hidden="true"></i>
          Connexion
        </span>
      </div>
    </header>

    <main class="public-results-shell">
      <section class="panel public-series-toolbar public-results-toolbar">
        <label class="public-session-select">
          <span>Session</span>
          <select id="publicResultsSessionSelect" aria-label="Choisir la session"></select>
          <small id="publicResultsSessionMeta" class="public-session-select-meta"></small>
        </label>
        <div class="public-series-toolbar-text">
          <h2>R&eacute;sultats</h2>
        </div>
        <div class="public-series-toolbar-actions public-results-actions">
          <button id="refreshPublicResultsBtn" class="ghost-button compact public-refresh-button" type="button" title="Actualiser" aria-label="Actualiser">&orarr;</button>
          <button id="collapsePublicDetailsBtn" class="ghost-button compact" type="button">Tout replier</button>
        </div>
      </section>

      <section id="publicSessionInfoHost"></section>

      <section class="panel">
        <div id="publicSessionControls" class="session-controls public-session-controls" hidden></div>
        <div id="publicResultsList" class="public-results-list">
          <p class="panel-subtitle">Chargement des r&eacute;sultats...</p>
        </div>
      </section>
    </main>

    <button id="refreshPublicResultsFloatBtn" class="public-floating-refresh" type="button" title="Actualiser" aria-label="Actualiser">&orarr;</button>

    <div id="publicSwimmerSheet" class="public-swimmer-sheet" hidden></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="assets/livepalmes-public-swimmer-view.js?v=20260528-speaker-page"></script>
    <script src="assets/livepalmes-public-swimmers.js?v=20260528-speaker-page"></script>
    <script src="assets/livepalmes-public-results-documents.js?v=20260528-speaker-page"></script>
    <script src="resultats.js?v=20260528-speaker-page"></script>
  </body>
</html>
