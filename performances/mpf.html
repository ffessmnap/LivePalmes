<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LivePalmes MPF</title>
    <link rel="stylesheet" href="public/styles.css?v=20260530-mobile1" />
  </head>
  <body class="mpf-page">
    <header class="topbar">
      <div>
        <p class="eyebrow">LivePalmes public &middot; Performances</p>
        <h1>Meilleures Performances Francaises</h1>
      </div>
      <img class="topbar-logo" src="public/assets/ffessm-nap-logo-quadri.png" alt="FFESSM Nage avec palmes" />
      <nav class="main-nav" aria-label="Navigation principale">
        <a href="../public.html">Accueil LivePalmes</a>
        <a href="records.html">Records de France</a>
        <a class="active" href="mpf.html">MPF</a>
        <a href="tops.html">TOP</a>
        <a href="nageur.html">Nageur</a>
      </nav>
    </header>

    <main>
      <section class="toolbar" aria-label="Filtres des MPF">
        <label>
          Categorie
          <select id="categoryFilter"></select>
        </label>
        <div class="field">
          <span>Sexe</span>
          <div class="segmented two-segments" id="sexFilter" role="group" aria-label="Sexe">
            <button type="button" class="segment" data-value="F">Femmes</button>
            <button type="button" class="segment" data-value="M">Hommes</button>
          </div>
        </div>
        <label>
          Course
          <select id="courseFilter"></select>
        </label>
        <button id="resetButton" type="button">Reinitialiser</button>
      </section>

      <section class="records-shell">
        <div class="table-head">
          <div>
            <h2 id="mpfTitle">Meilleures Performances Francaises</h2>
          </div>
          <span id="cutoffText"></span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Course</th>
                <th>Categorie</th>
                <th>Temps</th>
                <th>Nageur</th>
                <th>Club</th>
                <th>Lieu</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="public/data/records-data.js?v=20260530-last-update1"></script>
    <script src="public/app.js?v=20260530-mobile1"></script>
  </body>
</html>
