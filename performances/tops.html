<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LivePalmes TOP</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=20260819-hosting-2">
    <link rel="stylesheet" href="public/styles.css?v=20260824-top-birth-year-2" />
  </head>
  <body class="tops-page">
    <header class="topbar simple performance-public-topbar">
      <div class="topbar-title">
        <a class="topbar-home-link" href="../">Accueil LivePalmes</a>
        <p class="eyebrow">LivePalmes &middot; Performances</p>
        <h1 id="topSecretFilterTrigger" class="top-secret-filter-trigger">TOP</h1>
      </div>
      <img class="topbar-logo" src="public/assets/ffessm-nap-logo-quadri.png" alt="FFESSM Nage avec palmes" />
      <nav class="main-nav" aria-label="Navigation principale">
        <a href="records.html">Records de France</a>
        <a href="mpf.html">MPF</a>
        <a class="active" href="tops.html">TOP</a>
        <a href="nageur.html">Fiches nageurs</a>
      </nav>
    </header>

    <main>
      <section class="toolbar top-toolbar" aria-label="Filtres des TOP">
        <label class="top-filter-category">
          Cat&eacute;gorie
          <select id="topCategoryFilter"></select>
        </label>
        <div class="field top-filter-sex">
          <span>Sexe</span>
          <div class="segmented two-segments" id="topSexFilter" role="group" aria-label="Sexe">
            <button type="button" class="segment sex-f" data-value="F">Femmes</button>
            <button type="button" class="segment sex-m" data-value="M">Hommes</button>
          </div>
        </div>
        <label class="top-filter-season">
          Saison
          <select id="topSeasonFilter"></select>
        </label>
        <label class="top-filter-region">
          R&eacute;gion
          <select id="topRegionFilter"></select>
        </label>
        <div class="field top-filter-pool">
          Bassin
          <div class="segmented" id="topPoolFilter" role="group" aria-label="Bassin">
            <button type="button" class="segment active" data-value="" aria-pressed="true">Tous</button>
            <button type="button" class="segment" data-value="25" aria-pressed="false">25 m</button>
            <button type="button" class="segment" data-value="50" aria-pressed="false">50 m</button>
          </div>
        </div>
        <div class="top-filter-birth" id="topBirthYearField" hidden>
          <label>
            Ann&eacute;e de naissance
            <select id="topBirthYearFilter">
              <option value="">Toutes les ann&eacute;es</option>
            </select>
          </label>
        </div>
      </section>

      <section class="top-course-strip" aria-label="Choix de la course">
        <div id="topCourseButtons" class="top-course-buttons"></div>
      </section>

      <section class="records-shell">
        <div class="table-head">
          <div>
            <h2 id="topTitle">TOP</h2>
          </div>
          <span id="topStatus"></span>
        </div>

        <div class="table-wrap">
          <table class="top-results-table">
            <thead>
              <tr>
                <th>Rang</th>
                <th>Temps</th>
                <th id="topSwimmerHeader">Nageur</th>
                <th>Club</th>
                <th>Lieu</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="topBody"></tbody>
          </table>
        </div>
        <div class="top-load-more" id="topLoadMore" hidden>
          <button type="button" id="topLoadMoreButton">Afficher la suite</button>
        </div>
      </section>
    </main>
    <footer class="performance-public-footer">LivePalmes est un outil d&eacute;velopp&eacute; b&eacute;n&eacute;volement par la Commission Nationale Nage avec Palmes.<br><span>Une erreur ou un bug &agrave; signaler ? <a href="mailto:livepalmes@nap-ffessm.fr?subject=Signalement%20LivePalmes">Contactez-nous</a>.</span></footer>
    <script src="../assets/livepalmes-environment.js?v=20260903-environments-1"></script>
    <script src="public/data/intranap-summary.js?v=consolidated-20260603140205"></script>
    <script src="public/data/performance-public/version.js"></script>
    <script src="../assets/public/livepalmes-public-analytics.js?v=20260614-ga-public-1"></script>
    <script src="public/tops.js?v=20260824-top-birth-year-2"></script>
  </body>
</html>
